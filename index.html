    <style>
        :root {
            --accent: #6366f1;
            --accent-rgb: 99, 102, 241;
            --accent2: #8b5cf6;
            --surface: #0d0d14;
            --surface2: #13131f;
            --surface3: #1a1a2e;
            --border: rgba(255, 255, 255, 0.06);
            --text: #e8e8f0;
            --text-dim: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Syne', sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .glass-strong {

            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Gradient mesh background */
        .mesh-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:

                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 30% 30% at 60% 30%, rgba(6, 182, 212, 0.04) 0%, transparent 60%);

        /* Sidebar */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--surface2);

            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 40;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.closed {
            transform: translateX(-100%);
        }

        @media(min-width:1024px) {
            .sidebar {
                position: static;
                transform: none !important;
            }
        }

        .main-content {
            flex: 1;
            min-width: 0;
            margin-left: 0;
        }

        @media(min-width:1024px) {
            .main-content {
                margin-left: 260px;
            }
        }

        /* Nav items */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(var(--accent-rgb), 0.15);
            color: var(--text);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent);
            border-radius: 99px;
        }

            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 99px;
            margin-left: auto;
        }

        .card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;

            border-color: rgba(255, 255, 255, 0.1);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }

            content: '';

            right: -40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            opacity: 0.06;

            background: #3b82f6;
        }

        .stat-card.green::after {
            background: #10b981;
        }

        .stat-card.purple::after {
            background: #8b5cf6;
        }

        .stat-card.amber::after {
            background: #f59e0b;
        }

        .input-base {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-base:focus {
            border-color: rgba(var(--accent-rgb), 0.5);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
        }

        .input-base::placeholder {
            color: var(--text-dim);
        }

        select.input-base {
            appearance: none;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 4px 20px rgba(var(--accent-rgb), 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 28px rgba(var(--accent-rgb), 0.45);
            transform: translateY(-1px);

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);

        .btn-success {

            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .btn-success:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

            gap: 4px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;

            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .badge-green {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-amber {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-red {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-purple {
            background: rgba(139, 92, 246, 0.12);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .badge-gray {
            background: rgba(107, 114, 128, 0.12);
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.2);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Progress bars */
        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%)
            }

            100% {
                transform: translateX(100%)
            }
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-12px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4)
            }

            50% {
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0)
            }
        }

        .anim-up {
            animation: fadeUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .anim-in {
            animation: fadeIn 0.3s ease forwards;
        }

        .online-dot {
            animation: pulse-glow 2s infinite;
        }

        /* Notification toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            padding: 14px 20px;
            border-radius: 14px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideRight 0.3s ease;
            min-width: 280px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.15);
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.15);
        }

        .toast.warning {
            background: rgba(245, 158, 11, 0.15);
        }

        /* Modal */
        .modal-bg {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }

        .modal {
            background: var(--surface2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow: auto;
            animation: fadeUp 0.3s ease;
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #10b981;
        }

        .status-dot.offline {
            background: rgba(239, 68, 68, 0.5);
        }

        /* Section headers */
        .section-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -.02em;
            color: white;
            font-family: 'Syne', sans-serif;
        }

        .section-sub {
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Week nav */
        .week-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 10px;
        }

        .week-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .week-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .week-label {
            font-size: 13px;
            font-weight: 700;
            color: white;
            padding: 0 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tabs */
        .tab-group {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }

        .tab-item {
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-dim);
        }

        .tab-item.active {
            background: rgba(var(--accent-rgb), 0.15);
            color: white;
        }

        .tab-item:hover:not(.active) {
            color: var(--text);
        }

        /* Chart placeholder colors */
        .chart-bar {
            background: linear-gradient(to top, rgba(var(--accent-rgb), 0.3), rgba(var(--accent-rgb), 0.8));
            border-radius: 4px 4px 0 0;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);

            animation: skeleton-wave 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes skeleton-wave {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* Drag-drop planning */
        .plan-slot {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            transition: all 0.2s;
        }

        .plan-slot:hover {
            border-color: rgba(var(--accent-rgb), 0.4);
            background: rgba(var(--accent-rgb), 0.05);
        }

        .plan-shift {
            background: rgba(var(--accent-rgb), 0.15);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            border-radius: 8px;
        }

        .plan-shift.green {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .plan-shift.amber {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.25);
        }

        /* Kanban */
        .kanban-col {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 14px;
            min-height: 300px;
        }

        .kanban-card {
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: grab;
            transition: all 0.2s;
        }

        .kanban-card:hover {
            border-color: rgba(var(--accent-rgb), 0.3);
            transform: translateY(-2px);
        }

        /* Chart bars custom */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 120px;
        }

        .bar-chart-bar {
            flex: 1;
            border-radius: 6px 6px 0 0;
            min-width: 0;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Notification bell badge */
        .bell-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--surface2);
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
        }

        /* File upload zone */
        .upload-zone {
            border: 2px dashed rgba(var(--accent-rgb), 0.3);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-zone:hover {
            border-color: rgba(var(--accent-rgb), 0.6);
            background: rgba(var(--accent-rgb), 0.05);
        }

        /* Tooltip */
        .tooltip-wrap {
            position: relative;
        }

        .tooltip-wrap:hover .tooltip-box {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-box {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.15s;
            pointer-events: none;
            z-index: 99;
        }

        /* Login */
        .login-accent {
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.2), rgba(139, 92, 246, 0.2));
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }

        /* Color picker dots */
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
        }

        .color-dot.selected {
            border-color: white;
            transform: scale(1.15);
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        /* Plan cell */
        .plan-cell {
            min-height: 60px;
        }

        /* Sector tag */
        .sector-tag {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        /* Sticky header rows */
        .sticky-th {
            position: sticky;
            top: 0;
            z-index: 5;
        }

        /* Rich text area */
        textarea.input-base {
            resize: vertical;
            min-height: 80px;
            line-height: 1.6;
        }

        /* Rating stars */
        .star {
            color: #374151;
            cursor: pointer;
            transition: color 0.1s;
            font-size: 18px;
        }

        .star.lit {
            color: #f59e0b;
        }

        /* Loading spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        const db = window._db;

        // Cette fonction redirige toutes les données vers les chemins sécurisés d'origine 
        // (ceux utilisés par la toute première version de l'application)
        const getPath = (p) => `artifacts/${window._appId}/public/data/${p}`;

        const FS = {
            // Read a single document
            async docGet(path, fallback) {
                try {
                    await window._authReady;
                    const snap = await db.doc(getPath(path)).get();
                    return snap.exists ? snap.data() : fallback;
                } catch (e) { console.warn('FS docGet error:', path, e); return fallback; }
            },
            // Write a single document (merge)
            async docSet(path, data) {
                try {
                    await window._authReady;
                    await db.doc(getPath(path)).set(data, { merge: true });
                } catch (e) { console.warn('FS docSet error:', path, e); }
            },
            // Read all docs in a collection
            async collGet(path, fallback) {
                try {
                    await window._authReady;
                    const snap = await db.collection(getPath(path)).get();
                    if (snap.empty) return fallback;
                    return snap.docs.map(d => ({ ...d.data(), id: d.id }));
                } catch (e) { console.warn('FS collGet error:', path, e); return fallback; }
            },
            // Upsert a single doc in a collection
            async upsert(colPath, item) {
                try {
                    await window._authReady;
                    await db.collection(getPath(colPath)).doc(item.id).set({ ...item }, { merge: true });
                } catch (e) { console.warn('FS upsert error:', colPath, e); }
            },
            // Delete a single doc
            async del(colPath, id) {
                try {
                    await window._authReady;
                    await db.collection(getPath(colPath)).doc(id).delete();
                } catch (e) { console.warn('FS del error:', colPath, e); }
            },
            // Overwrite entire collection (for grades etc.)
            async collSet(colPath, items) {
                try {
                    await window._authReady;
                    const batch = db.batch();
                    const snap = await db.collection(getPath(colPath)).get();
                    snap.docs.forEach(d => batch.delete(d.ref));
                    items.forEach(item => {
                        const ref = db.collection(getPath(colPath)).doc(item.id || `doc_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
                        batch.set(ref, { ...item });
                    });
                    await batch.commit();
                } catch (e) { console.warn('FS collSet error:', colPath, e); }
            },
            // Real-time listener on a collection
            listen(colPath, cb) {
                let unsub = () => { };
                window._authReady.then(() => {
                    unsub = db.collection(getPath(colPath)).onSnapshot(snap => {
                        cb(snap.docs.map(d => ({ ...d.data(), id: d.id })));
                    }, err => console.warn('FS listen error:', colPath, err));
                });
                return () => unsub();
            },
            // Real-time listener on a document
            docListen(path, cb, fallback) {
                let unsub = () => { };
                window._authReady.then(() => {
                    unsub = db.doc(getPath(path)).onSnapshot(snap => {
                        cb(snap.exists ? snap.data() : fallback);
                    }, err => console.warn('FS docListen error:', path, err));
                });
                return () => unsub();
            },
            // Clear a collection
            async collClear(colPath) {
                try {
                    await window._authReady;
                    const batch = db.batch();
                    const snap = await db.collection(getPath(colPath)).get();
                    snap.docs.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                } catch (e) { console.warn('FS collClear error:', colPath, e); }
            }

                const s = sw(selectedDate), e = ew(selectedDate);

                const revenue = myInv.reduce((a, c) => a + c.price, 0);

                const bonusT = myInv.reduce((a, c) => a + (c.bonus || 0), 0);
                const grd = grades.find(g => g.name === target.grade);
                const maxSalary = grd?.maxSalary || 0;
                const targetProfit = maxSalary * 1.5;
                const progress = targetProfit > 0 ? Math.min(profit / targetProfit * 100, 100) : 100;
                const isComplete = progress >= 100;
                const earnedSalary = maxSalary * (progress / 100);
                const logs = serviceLogs.filter(l => { const d = new Date(l.date); return l.employeeId === target.id && d >= s && d <= e; });
                let totalMs = logs.reduce((a, l) => a + l.duration, 0);
                if (target.id === currentUser?.id && isServiceActive && serviceStartTime) totalMs += serviceTimer;
                return { myInv, revenue, profit, bonusT, maxSalary, targetProfit, progress, isComplete, earnedSalary, totalMs };
            }, [weekStats, grades, serviceLogs, selectedDate, currentUser, isServiceActive, serviceStartTime, serviceTimer]);

            // ===================== SECTOR INFO =====================
            const sector = useMemo(() => BUSINESS_SECTORS.find(s => s.id === theme.sector) || BUSINESS_SECTORS[BUSINESS_SECTORS.length - 1], [theme.sector]);

            // ===================== RENDER =====================
            if (loading && !currentUser) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="text-center">
                        <div className="spinner" style={{ width: 40, height: 40, margin: '0 auto 16px' }} />

                    </div>

            if (!currentUser) return <LoginScreen {...{ theme, employees, loginForm, setLoginForm, loginError, handleLogin, stayConnected, setStayConnected, authMode, setAuthMode, appForm, setAppForm, handleSubmitApp, toast, showToast, sector }} />;

            const navItems = [
                { id: 'dashboard', icon: LayoutDashboard, label: 'Dashboard', admin: true },
                { id: 'personal', icon: User, label: 'Mon Espace' },
                { id: 'facture', icon: Plus, label: `Nouvelle ${sector.invoiceLabel}` },
                { id: 'historique', icon: History, label: 'Historique' },
                { id: 'clients', icon: Users, label: 'Base Clients', admin: false },
                { id: 'tasks', icon: CheckSquare, label: 'Tâches', badge: tasks.filter(t => t.status !== 'done' && t.assignee === currentUser.id).length || null },
                { id: 'planning', icon: Calendar, label: 'Planning' },
                { id: 'contracts', icon: FileSignature, label: 'Contrats' },
                { id: 'tarifs', icon: Tag, label: 'Tarifs' },
                { id: 'aide', icon: HelpCircle, label: 'Aide' },
                { id: 'hr', icon: Briefcase, label: 'Ressources Humaines', admin: true, badge: applications.length || null },
                { id: 'salaires', icon: Award, label: 'Salaires & Primes', admin: true },
                { id: 'settings', icon: Settings, label: 'Configuration', admin: true },

            const visibleNav = navItems.filter(n => !n.admin || (n.admin && isBoss));

            const unreadNotifs = appNotifs.filter(n => !n.read).length;

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className={`sidebar ${sidebarOpen ? '' : 'closed'}`}>
                        {/* Logo */}
                        <div className="p-5 pb-3 border-b" style={{ borderColor: 'var(--border)' }}>
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl flex items-center justify-center text-white text-lg font-bold flex-shrink-0" style={{ background: `linear-gradient(135deg,${theme.accentHex || '#6366f1'},var(--accent2))` }}>
                                    {theme.appName.charAt(0)}
                                </div>
                                <div className="min-w-0">
                                    <h1 className="text-sm font-bold text-white truncate leading-tight">{theme.appName}</h1>
                                    <p className="text-xs truncate" style={{ color: 'var(--text-dim)' }}>{sector.label}</p>
                                </div>
                                <button className="ml-auto" style={{ color: 'var(--text-dim)' }} onClick={() => setSidebarOpen(false)}>

                                </button>
                            </div>
                        </div>

                        {/* Service widget */}
                        {currentUser && (

                                    <span className="text-xs font-bold uppercase tracking-wider" style={{ color: isServiceActive ? '#34d399' : 'var(--text-dim)' }}>
                                        {isServiceActive ? 'En service' : 'Hors service'}
                                    </span>
                                    {isServiceActive && <span className="mono text-xs text-emerald-400">{fmtDuration(serviceTimer)}</span>}
                                </div>
                                <button onClick={handleToggleService} className={`w-full btn text-xs py-1.5 ${isServiceActive ? 'btn-danger' : 'btn-success'}`}>

                                </button>
                            </div>
                        )}

                        {/* Nav */}
                        <nav className="flex-1 overflow-y-auto p-3 space-y-0.5">
                            <p className="px-3 pt-2 pb-1 text-xs font-bold uppercase tracking-widest" style={{ color: 'rgba(255,255,255,0.2)' }}>Navigation</p>
                            {visibleNav.slice(0, 6).map(n => (
                                <div key={n.id} className={`nav-item ${activeTab === n.id ? 'active' : ''}`} onClick={() => { setActiveTab(n.id); if (n.id === 'personal') setDashTarget(currentUser); if (window.innerWidth < 1024) setSidebarOpen(false); }}>
                                    <n.icon size={17} />
                                    <span>{n.label}</span>
                                    {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
                                </div>
                            ))}
                            {isBoss && <><p className="px-3 pt-3 pb-1 text-xs font-bold uppercase tracking-widest" style={{ color: 'rgba(255,255,255,0.2)' }}>Gestion</p>

                                    <div key={n.id} className={`nav-item ${activeTab === n.id ? 'active' : ''}`} onClick={() => { setActiveTab(n.id); if (window.innerWidth < 1024) setSidebarOpen(false); }}>
                                        <n.icon size={17} /><span>{n.label}</span>
                                        {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
                                    </div>
                                ))}
                                <p className="px-3 pt-3 pb-1 text-xs font-bold uppercase tracking-widest" style={{ color: 'rgba(255,255,255,0.2)' }}>Admin</p>
                                {visibleNav.slice(10).map(n => (
                                    <div key={n.id} className={`nav-item ${activeTab === n.id ? 'active' : ''}`} onClick={() => { setActiveTab(n.id); if (window.innerWidth < 1024) setSidebarOpen(false); }}>
                                        <n.icon size={17} /><span>{n.label}</span>
                                        {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
                                    </div>
                                ))}</>}
                            {!isBoss && <>{visibleNav.slice(6).map(n => (
                                <div key={n.id} className={`nav-item ${activeTab === n.id ? 'active' : ''}`} onClick={() => { setActiveTab(n.id); if (window.innerWidth < 1024) setSidebarOpen(false); }}>
                                    <n.icon size={17} /><span>{n.label}</span>
                                    {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
                                </div>
                            ))}</>}
                        </nav>

                        {/* User */}
                        <div className="p-3 border-t" style={{ borderColor: 'var(--border)' }}>
                            <div className="flex items-center gap-3 p-3 rounded-xl" style={{ background: 'rgba(0,0,0,0.2)' }}>
                                <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0" style={{ background: 'linear-gradient(135deg,var(--accent),var(--accent2))' }}>
                                    {currentUser.name.charAt(0)}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-semibold text-white truncate">{currentUser.name}</p>
                                    <p className="text-xs truncate" style={{ color: 'var(--text-dim)' }}>{currentUser.grade}</p>
                                </div>
                                <button onClick={handleLogout} title="Déconnexion" style={{ color: 'var(--text-dim)' }} className="hover:text-white transition-colors"><LogOut size={16} /></button>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN */}
                    <div className="main-content flex flex-col h-screen overflow-hidden" style={{ marginLeft: sidebarOpen ? '260px' : '0', transition: 'margin 0.3s' }}>
                        {/* Top bar */}
                        <header className="flex items-center gap-3 px-6 py-3 border-b flex-shrink-0" style={{ borderColor: 'var(--border)', background: 'rgba(13,13,20,0.8)', backdropFilter: 'blur(20px)' }}>
                            <button className="p-2 rounded-lg hover:bg-white/5 transition-colors" style={{ color: 'var(--text-dim)' }} onClick={() => setSidebarOpen(!sidebarOpen)}>
                                <Menu size={20} />
                            </button>
                            <div className="flex-1" />

                            {/* Notification bell */}
                            <div className="relative">
                                <button className="p-2 rounded-lg hover:bg-white/5 transition-colors relative" style={{ color: 'var(--text-dim)' }} onClick={() => setModal({ type: 'notifs' })}>
                                    <Bell size={20} />
                                    {unreadNotifs > 0 && <span className="bell-badge">{unreadNotifs > 9 ? '9+' : unreadNotifs}</span>}
                                </button>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className={`status-dot ${isServiceActive ? 'online' : 'offline'}`} />
                                <span className="text-xs font-medium" style={{ color: 'var(--text-dim)' }}>{currentUser.name.split(' ')[0]}</span>
                            </div>
                        </header>

                        {/* Content */}
                        <main className="flex-1 overflow-y-auto p-6" style={{ scrollbarWidth: 'thin' }}>
                            <div className="anim-in" key={activeTab}>
                                {activeTab === 'dashboard' && <DashboardTab {...{ weekStats, selectedDate, setSelectedDate, theme, handleViewEmpStats: emp => { setDashTarget(emp); setActiveTab('personal'); }, sector, invoices, config }} />}
                                {activeTab === 'personal' && <PersonalTab {...{ target: dashTarget || currentUser, currentUser, weekStats, selectedDate, setSelectedDate, getPersonalStats, isServiceActive, serviceTimer, serviceStartTime, isBoss, theme, grades, serviceLogs, sector, config }} />}
                                {activeTab === 'facture' && <InvoiceTab {...{ newInvoice, setNewInvoice, handleCreateInvoice, config, calcMetrics, uniqueClients, theme, sector }} />}
                                {activeTab === 'historique' && <HistoryTab {...{ invoices, weekStats, selectedDate, setSelectedDate, histSearch, setHistSearch, histFilter, setHistFilter, handleDeleteInvoice, isBoss, currentUser, config, editingInvoiceId, setEditingInvoiceId, editClientName, setEditClientName, handleUpdateInvoiceClient, theme, sector, genInvoicePDF: inv => genInvoicePDF(inv, theme), genExcelCSV }} />}
                                {activeTab === 'clients' && <ClientsTab {...{ clientStats, invoices, clientSearch, setClientSearch, selectedClient, setSelectedClient, handleRenameClient, isBoss, theme, genInvoicePDF: inv => genInvoicePDF(inv, theme) }} />}
                                {activeTab === 'tasks' && <TasksTab {...{ tasks, newTask, setNewTask, handleAddTask, handleUpdateTask, handleDeleteTask, employees, currentUser, taskFilter, setTaskFilter, isBoss, theme }} />}
                                {activeTab === 'planning' && <PlanningTab {...{ employees: sortedEmployees, serviceLogs, planDate, setPlanDate, theme }} />}
                                {activeTab === 'contracts' && <ContractsTab {...{ contracts, newContract, setNewContract, handleSaveContract, handleDeleteContract, editingContract, setEditingContract, isBoss, theme }} />}
                                {activeTab === 'tarifs' && <TarifsTab {...{ config, handleSaveConfig, isBoss, theme }} />}
                                {activeTab === 'aide' && <AideTab {...{ customMessages, setCustomMessages, isEditingMessages, setIsEditingMessages, handleSaveMessages, isBoss, theme }} />}
                                {activeTab === 'hr' && <HRTab {...{ employees: sortedEmployees, applications, newEmployee, setNewEmployee, handleAddEmployee, handleAcceptApp, handleRejectApp, editingEmployee, setEditingEmployee, setModal, isBoss, grades, theme, handleViewEmpStats: emp => { setDashTarget(emp); setActiveTab('personal'); }, sector, serviceLogs, weekStats }} />}
                                {activeTab === 'salaires' && <SalairesTab {...{ weekStats, grades, selectedDate, setSelectedDate, generatePaySlipPDF: genPaySlipPDF, theme, genExcelCSV, invoices, serviceLogs, config }} />}
                                {activeTab === 'settings' && <SettingsTab {...{ theme, handleSaveTheme, config, handleSaveConfig, grades, handleSaveGrades, confirmResetId, setConfirmResetId, handleResetStats, customMessages, setCustomMessages, handleSaveMessages, isEditingMessages, setIsEditingMessages, sector, showToast }} />}
                            </div>
                        </main>
                    </div>

                    {/* MODALS */}
                    {modal?.type === 'notifs' && (
                        <div className="modal-bg" onClick={() => setModal(null)}>
                            <div className="modal p-0 overflow-hidden max-w-sm" onClick={e => e.stopPropagation()}>
                                <div className="p-5 border-b flex items-center justify-between" style={{ borderColor: 'var(--border)' }}>
                                    <h3 className="font-bold text-white">Notifications</h3>
                                    <div className="flex gap-2">
                                        <button className="text-xs" style={{ color: 'var(--text-dim)' }} onClick={() => setAppNotifs(p => p.map(n => ({ ...n, read: true })))}>Tout lire</button>
                                        <button onClick={() => setModal(null)} style={{ color: 'var(--text-dim)' }}><X size={18} /></button>
                                    </div>
                                </div>
                                <div style={{ maxHeight: '400px', overflowY: 'auto' }}>
                                    {appNotifs.length === 0 && <p className="p-6 text-center text-sm" style={{ color: 'var(--text-dim)' }}>Aucune notification.</p>}
                                    {appNotifs.map(n => (
                                        <div key={n.id} className="p-4 border-b flex gap-3 cursor-pointer hover:bg-white/3 transition-colors" style={{ borderColor: 'var(--border)', opacity: n.read ? 0.5 : 1 }} onClick={() => setAppNotifs(p => p.map(x => x.id === n.id ? { ...x, read: true } : x))}>
                                            <div className="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style={{ background: n.read ? 'transparent' : 'var(--accent)' }} />
                                            <div>
                                                <p className="text-sm text-white">{n.msg}</p>
                                                <p className="text-xs mt-1" style={{ color: 'var(--text-dim)' }}>{fmtTime(n.ts)}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    {editingEmployee && (
                        <EmployeeModal emp={editingEmployee} setEmp={setEditingEmployee} grades={grades} handleSave={handleSaveEmployee} handleFire={handleFireEmployee} currentUser={currentUser} isBoss={isBoss} theme={theme} />
                    )}

                    {toast && <Toast msg={toast.msg} type={toast.type} />}
                </div>
            );
        }

        // =============================================
        // LOGIN SCREEN
        // =============================================
        function LoginScreen({ theme, employees, loginForm, setLoginForm, loginError, handleLogin, stayConnected, setStayConnected, authMode, setAuthMode, appForm, setAppForm, handleSubmitApp, toast, sector }) {
            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative">
                    <div className="w-full max-w-md anim-up">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center text-2xl font-black text-white" style={{ background: `linear-gradient(135deg,var(--accent),var(--accent2))` }}>
                                {theme.appName.charAt(0)}
                            </div>
                            <h1 className="text-2xl font-black text-white" style={{ letterSpacing: '-.03em' }}>{theme.appName}</h1>

                                            <div className={`w-5 h-5 rounded flex items-center justify-center transition-all ${stayConnected ? 'text-white' : 'border'}`} style={stayConnected ? { background: 'var(--accent)' } : { borderColor: 'rgba(255,255,255,0.2)' }} onClick={() => setStayConnected(!stayConnected)}>
                                                {stayConnected && <CheckCircle size={14} />}

                                    </form>

                                </>

                                    <button onClick={() => setAuthMode('login')} className="flex items-center gap-2 text-sm mb-5 transition-colors hover:text-white" style={{ color: 'var(--text-dim)' }}>

                                    <div className="space-y-4">

                                            <Input label="Prénom *" value={appForm.firstName} onChange={e => setAppForm({ ...appForm, firstName: e.target.value })} placeholder="Prénom" />
                                            <Input label="Nom *" value={appForm.lastName} onChange={e => setAppForm({ ...appForm, lastName: e.target.value })} placeholder="Nom" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <Input label="Téléphone" value={appForm.phone} onChange={e => setAppForm({ ...appForm, phone: e.target.value })} placeholder="06..." />
                                            <Input label="Email" type="email" value={appForm.email} onChange={e => setAppForm({ ...appForm, email: e.target.value })} placeholder="email@ext.com" />

                                        <Input label="Expérience" value={appForm.experience} onChange={e => setAppForm({ ...appForm, experience: e.target.value })} placeholder="Vos expériences..." rows={2} />
                                        <button onClick={handleSubmitApp} className="btn btn-primary w-full justify-center py-3"><Send size={16} />Envoyer</button>

                    </div>
                    {toast && <Toast msg={toast.msg} type={toast.type} />}
                </div>
            );
        }

        // =============================================
        // DASHBOARD TAB
        // =============================================
        function DashboardTab({ weekStats, selectedDate, setSelectedDate, theme, handleViewEmpStats, sector, invoices, config }) {
            const COLORS = ['#6366f1', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ef4444'];
            const allTimeRevenue = invoices.reduce((a, c) => a + c.price, 0);
            const allTimeProfit = invoices.reduce((a, c) => a + (c.profit || 0), 0);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div><h2 className="section-title">Dashboard</h2><p className="section-sub">Vue d'ensemble · {sector.label}</p></div>

                        <StatCard label="Bénéfice net" value={weekStats.totalProfit} prefix="€ " icon={Wallet} color="green" />

                        {/* Revenue chart */}
                        <div className="card p-5 lg:col-span-2">
                            <h3 className="font-display font-bold text-white mb-4 flex items-center gap-2"><TrendingUp size={16} style={{ color: 'var(--accent)' }} />Activité hebdomadaire</h3>
                            <div style={{ height: 220 }}>
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={weekStats.days}>
                                        <defs><linearGradient id="ca" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={theme.accentHex || '#6366f1'} stopOpacity={0.3} /><stop offset="100%" stopColor={theme.accentHex || '#6366f1'} stopOpacity={0} /></linearGradient></defs>

                                    </AreaChart>
                                </ResponsiveContainer>

                            <h3 className="font-display font-bold text-white mb-4 flex items-center gap-2"><PieChart size={16} className="text-purple-400" />Répartition prestations</h3>
                            {weekStats.pieData.length > 0 ? (
                                <div style={{ height: 180 }}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <RePieChart>
                                            <Pie data={weekStats.pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={75} paddingAngle={4} dataKey="value" animationDuration={800}>
                                                {weekStats.pieData.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} stroke="none" />)}

                                            <Tooltip contentStyle={{ background: '#1a1a2e', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, color: 'white' }} />
                                        </RePieChart>
                                    </ResponsiveContainer>
                                </div>
                            ) : <div style={{ height: 180, color: 'var(--text-dim)' }} className="flex items-center justify-center text-sm">Aucune donnée</div>}
                            <div className="space-y-2 mt-2">
                                {weekStats.pieData.slice(0, 4).map((d, i) => (
                                    <div key={i} className="flex items-center justify-between text-xs">
                                        <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full" style={{ background: COLORS[i % COLORS.length] }} /><span style={{ color: 'var(--text-dim)' }}>{d.name}</span></div>
                                        <span className="font-semibold text-white">€ {fmtMoney(d.value)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Employee ranking */}

        // =============================================
        // INVOICE TAB
        // =============================================
        function InvoiceTab({ newInvoice, setNewInvoice, handleCreateInvoice, config, calcMetrics, uniqueClients, theme, sector }) {
            const [selectedGrille, setSelectedGrille] = useState('');
            const m = calcMetrics(newInvoice.type, newInvoice.price);
            const price = parseFloat(newInvoice.price) || 0;

            const handleGrilleChange = (e) => {
                setSelectedGrille(e.target.value);
            };

            const handleTypeChange = (e) => {
                const t = e.target.value;
                let newPrice = newInvoice.price;
                if (selectedGrille) {
                    const grille = (config.priceList || []).find(c => c.category === selectedGrille);
                    if (grille) {
                        const item = grille.items.find(i => i.name === t);
                        if (item) newPrice = item.price.toString();
                    }
                }
                setNewInvoice({ ...newInvoice, type: t, price: newPrice });
            };

            // Options: either the items of the selected Grille, or all global services
            const serviceOptions = selectedGrille
                ? ((config.priceList || []).find(c => c.category === selectedGrille)?.items.map(i => i.name) || [])
                : ((config.services || []).map(s => s.name));

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div><h2 className="section-title">Nouvelle {sector.invoiceLabel}</h2><p className="section-sub">Enregistrement rapide · Calcul automatique</p></div>
                    <div className="card p-6 space-y-5">
                        <div>
                            <Input label={`Client / ${sector.invoiceLabel}`} required value={newInvoice.client} onChange={e => setNewInvoice({ ...newInvoice, client: e.target.value })} placeholder="Nom du client ou entreprise" list="cl-list" prefix={User} />
                            <datalist id="cl-list">{uniqueClients.map((c, i) => <option key={i} value={c} />)}</datalist>
                        </div>
                        {(config.priceList && config.priceList.length > 0) && (
                            <Select label="Grille tarifaire (Optionnel)" options={(config.priceList || []).map(c => c.category)} value={selectedGrille} onChange={handleGrilleChange} />
                        )}
                        <Select label="Type de prestation *" required options={serviceOptions} value={newInvoice.type} onChange={handleTypeChange} />
                        <Input label="Montant (€) *" required type="number" prefix={DollarSign} placeholder="0.00" value={newInvoice.price} onChange={e => setNewInvoice({ ...newInvoice, price: e.target.value })} />

                        {price > 0 && (
                            <div className="rounded-xl p-4 space-y-2" style={{ background: 'rgba(0,0,0,0.3)', border: '1px solid rgba(255,255,255,0.06)' }}>
                                <p className="text-xs font-bold uppercase tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>Estimation automatique</p>
                                <div className="flex justify-between text-sm">
                                    <span style={{ color: 'var(--text-dim)' }}>Prix facturé</span><span className="text-white mono">€ {fmtMoney(price)}</span>
                                </div>
                                <div className="flex justify-between text-sm">
                                    <span style={{ color: 'var(--text-dim)' }}>Charges / taxes ({m.cost}%)</span><span className="text-red-400 mono">− € {fmtMoney(m.costAmt)}</span>
                                </div>
                                <div className="h-px" style={{ background: 'var(--border)' }} />
                                <div className="flex justify-between font-bold">
                                    <span className="text-white">Bénéfice net</span><span className="text-emerald-400 mono text-lg">€ {fmtMoney(m.profit)}</span>
                                </div>
                            </div>
                        )}

                        <button onClick={handleCreateInvoice} className="btn btn-primary w-full justify-center py-3 text-base"><Save size={18} />Enregistrer</button>
                    </div>
                </div>
            );
        }

                                {(config.services || []).map(s => <option key={s.id} value={s.name}>{s.name}</option>)}

                            <ChevronDown size={13} className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: 'var(--text-dim)' }} />

                    <div className="card overflow-hidden">

                            <table className="data-table">

                                    {isBoss && <th className="text-right">Bénéfice</th>}
                                    <th>Employé</th><th className="text-center">Actions</th>
                                </tr></thead>
                                <tbody>
                                    {filtered.map(inv => (
                                        <tr key={inv.id}>
                                            <td className="text-xs" style={{ color: 'var(--text-dim)' }}>{fmtDate(inv.date)} {fmtTime(inv.date)}</td>
                                            <td>
                                                {editingInvoiceId === inv.id ? (
                                                    <div className="flex items-center gap-1">
                                                        <input autoFocus className="input-base py-1 text-sm w-32" value={editClientName} onChange={e => setEditClientName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleUpdateInvoiceClient(inv.id); if (e.key === 'Escape') { setEditingInvoiceId(null); setEditClientName(''); } }} />
                                                        <button onClick={() => handleUpdateInvoiceClient(inv.id)} className="text-emerald-400"><CheckCircle size={15} /></button>
                                                        <button onClick={() => { setEditingInvoiceId(null); setEditClientName(''); }} className="text-red-400"><XCircle size={15} /></button>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-center gap-2 group">
                                                        <span className="font-medium text-white">{inv.client}</span>

                                                    </div>
                                                )}
                                            </td>
                                            <td><Badge color="gray">{inv.type}</Badge></td>
                                            <td className="text-right mono font-bold text-white">€ {fmtMoney(inv.price)}</td>
                                            {isBoss && <td className={`text-right mono font-bold ${(inv.profit || 0) >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>€ {fmtMoney(inv.profit)}</td>}
                                            <td className="text-sm" style={{ color: 'var(--text-dim)' }}>{inv.employeeName}</td>
                                            <td>
                                                <div className="flex items-center justify-center gap-1">

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
