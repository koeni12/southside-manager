        const getStartOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            d.setHours(0,0,0,0);
            return d;
        };

        const getEndOfWeek = (date) => {
            const d = getStartOfWeek(date);
            d.setDate(d.getDate() + 6);
            d.setHours(23,59,59,999);
            return d;
        };

        const formatDateRange = (start, end) => {
            return `${start.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} - ${end.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}`;
        };
        
        const getGradeColor = (grade) => {
            const lowerGrade = grade?.toLowerCase() || '';
            if (lowerGrade.includes('patron') && !lowerGrade.includes('co')) return 'red';
            if (lowerGrade.includes('co-patron')) return 'amber';
            if (lowerGrade.includes('avocat')) return 'purple';
            if (lowerGrade.includes('chef')) return 'blue';
            if (lowerGrade.includes('mécano')) return 'green';
            return 'gray';
        };

        // --- PAY SLIP GENERATOR ---
        const generatePaySlipPDF = (employee, salaryData, periodStart, theme) => {
            const doc = new jsPDF();
            const start = getStartOfWeek(periodStart);
            const end = getEndOfWeek(periodStart);
            const periodStr = `${start.toLocaleDateString()} au ${end.toLocaleDateString()}`;

            doc.setFillColor(15, 15, 15);

        const GlassCard = ({ children, className = "" }) => (

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled = false, type="button", color }) => {
            const baseStyle = "px-5 py-2.5 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-95";
            
            // Dynamic generation of primary style based on theme color if not overridden

                ? `bg-gradient-to-r from-${color}-600 to-${color}-500 hover:from-${color}-500 hover:to-${color}-400 text-white shadow-lg shadow-${color}-500/30 border border-${color}-500/20`

            const variants = {
                primary: dynamicPrimary,
                danger: "bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white shadow-lg shadow-red-500/20",
                secondary: "bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700",

                success: "bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg shadow-emerald-500/30"
            };
            return <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`} disabled={disabled}>{children}</button>;
        };

                    type={type} 
                    value={value} 
                    onChange={onChange} 
                    readOnly={readOnly} 
                    placeholder={placeholder} 
                    list={list} 
                    autoFocus={autoFocus}
                    onKeyDown={onKeyDown}
                    onClick={onClick}
                    className={`w-full bg-black/40 border border-gray-700 rounded-xl py-3 px-4 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-white focus:ring-2 focus:ring-white/10 transition-all ${prefix ? 'pl-9' : ''} ${readOnly ? 'cursor-not-allowed opacity-60' : ''}`}

            </div>
        );

                {label && <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">{label} {required && "*"}</label>}

                purple: "bg-violet-500/10 text-violet-400 border-violet-500/20",

                amber: "bg-amber-500/10 text-amber-400 border-amber-500/20"

            return <span className={`px-3 py-1 rounded-lg text-xs font-bold tracking-wide border ${styles[color] || styles.blue}`}>{children}</span>;

            return (

                    <button onClick={onNext} className="p-2 hover:bg-gray-700 rounded-lg text-gray-400 hover:text-white transition-colors"><ChevronRight size={20} /></button>
                </div>
            );
        };

            const [currentUser, setCurrentUser] = useState(null); 
            const [dashboardTargetUser, setDashboardTargetUser] = useState(null); 
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [authUser, setAuthUser] = useState(null); // Firebase Auth State
            const [isOffline, setIsOffline] = useState(false); // Offline Fallback State

            // Data State (Managed by Firestore Subscriptions or Local State)
            const [config, setConfig] = useState(INITIAL_CONFIG);
            const [theme, setTheme] = useState(INITIAL_THEME); // THEME STATE
            const [employees, setEmployees] = useState([]);
            const [contracts, setContracts] = useState([]);
            const [grades, setGrades] = useState(INITIAL_GRADES);
            const [invoices, setInvoices] = useState([]);
            const [prices, setPrices] = useState(INITIAL_GARAGE_PRICES);
            const [applications, setApplications] = useState([]);
            const [customMessages, setCustomMessages] = useState(INITIAL_MESSAGES);

            const [isEditingPrices, setIsEditingPrices] = useState(false);
            const [isEditingMessages, setIsEditingMessages] = useState(false);
            
            // UI States
            const [authMode, setAuthMode] = useState('login'); 
            const [applicationForm, setApplicationForm] = useState({ name: '', dob: '', motivation: '', ageHRP: '', availability: '', phoneRP: '', discord: '' });
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [historySearch, setHistorySearch] = useState('');
            const [historyFilter, setHistoryFilter] = useState('');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [loginError, setLoginError] = useState('');
            
            // --- State pour la fonctionnalité "Rester connecté" ---
            const [stayConnected, setStayConnected] = useState(false);
            
            // --- States pour l'édition des factures ---
            const [editingInvoiceId, setEditingInvoiceId] = useState(null);
            const [editingClientName, setEditingClientName] = useState('');
            
            // --- State pour la recherche clients ---
            const [clientSearch, setClientSearch] = useState('');
            const [selectedClient, setSelectedClient] = useState(null);
            
            // --- State pour renommer un client (Base Clients) ---
            const [isRenamingClient, setIsRenamingClient] = useState(false);
            const [renameValue, setRenameValue] = useState('');

            const [newInvoice, setNewInvoice] = useState({ client: '', type: '', price: '' });
            const [newEmployee, setNewEmployee] = useState({ name: '', grade: '', dob: '', contractUrl: '', iban: '' });
            const [newContract, setNewContract] = useState({ company: '', date: '', endDate: '', description: '', url: '', supplementaryDocs: [] });
            const [editingContractId, setEditingContractId] = useState(null);
            const [tempDoc, setTempDoc] = useState({ name: '', url: '' });
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [editingEmployee, setEditingEmployee] = useState(null);
            const [confirmFire, setConfirmFire] = useState(false); 
            const [confirmReset, setConfirmReset] = useState(false);
            const [notification, setNotification] = useState(null);

            // --- ETATS POUR LE SERVICE (Pointage) ---
            const [serviceLogs, setServiceLogs] = useState([]);
            const [isServiceActive, setIsServiceActive] = useState(false);
            const [serviceStartTime, setServiceStartTime] = useState(null);

            // GLOBAL PERMISSIONS
            const isBoss = currentUser ? ['Patron', 'Co-patron'].includes(currentUser.grade) : false;
            const isLawyer = currentUser ? currentUser.grade === 'Avocat' : false;

            // --- FIREBASE SETUP ---
            
            // 1. Auth & Seeding
            useEffect(() => {
                if (!auth) return;

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth failed:", err);
                        // Fallback to offline mode on auth failure (e.g., restricted operation)
                        setIsOffline(true);
                        setNotification({ msg: "Mode Hors-ligne activé (Erreur Firebase: " + err.code + "). Les données seront sauvegardées localement.", type: 'warning' });
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setAuthUser(user);
                });
                return () => unsubscribe();
            }, []);

            // --- AUTO-LOGIN EFFECT (RESTER CONNECTÉ) ---
            useEffect(() => {
                const savedUserId = localStorage.getItem('southside_session_user');
                // On attend que la liste des employés soit chargée et qu'aucun utilisateur ne soit connecté
                if (savedUserId && !currentUser && employees.length > 0) {
                    const user = employees.find(e => e.id === savedUserId);
                    if (user) {
                        setCurrentUser(user);
                        setDashboardTargetUser(user);
                        
                        // Redirection intelligente selon le rôle
                        if (user.role === 'admin') setActiveTab('dashboard');
                        else if (user.grade === 'Avocat') setActiveTab('hr'); 
                        else setActiveTab('personal');
                        
                        showNotification(`Session restaurée. Bon retour ${user.name.split(' ')[0]} !`);
                    }
                }
            }, [employees, currentUser]);

            // --- LOGIQUE DE SERVICE (AUTO-STOP & HEARTBEAT) ---
            
            // Helper pour mettre à jour le statut en ligne de l'employé
            const updateServiceStatus = async (empId, status) => {
                if (!empId) return;
                
                if (isOffline) {
                    setEmployees(prev => prev.map(e => e.id === empId ? { ...e, isServiceActive: status } : e));
                } else {
                    const emp = employees.find(e => e.id === empId);
                    if (emp) {
                        const docRefId = emp.docId || emp.id;
                        try {
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', docRefId), { isServiceActive: status });
                        } catch (e) {
                            console.error("Erreur maj statut service:", e);
                        }
                    }
                }
            };

            // A. Initialisation et Récupération au chargement
            useEffect(() => {
                // Charger les logs existants
                const savedLogs = localStorage.getItem('southside_service_logs');
                if (savedLogs) setServiceLogs(JSON.parse(savedLogs));

                // Vérifier si une session a été interrompue brutalement (fermeture onglet)
                const wasActive = localStorage.getItem('southside_service_is_active') === 'true';
                const lastHeartbeat = parseInt(localStorage.getItem('southside_service_heartbeat'));
                const savedStart = parseInt(localStorage.getItem('southside_service_start'));
                const sessionUser = localStorage.getItem('southside_session_user');

                if (wasActive && lastHeartbeat && savedStart) {
                    // On clôture la session précédente à la dernière heure connue (lastHeartbeat)
                    const recoveredLog = {
                        id: Date.now(),
                        employeeId: sessionUser || 'unknown',
                        startTime: savedStart,
                        endTime: lastHeartbeat,
                        duration: lastHeartbeat - savedStart,
                        date: new Date(savedStart).toISOString()
                    };

                    setServiceLogs(prev => {
                        const newLogs = [...prev, recoveredLog];
                        localStorage.setItem('southside_service_logs', JSON.stringify(newLogs));
                        return newLogs;
                    });

                    // Si on a l'ID user, on remet son statut à false dans la BDD car il n'est plus là
                    if (sessionUser) {
                        updateServiceStatus(sessionUser, false);
                    }

                    // Nettoyage
                    localStorage.removeItem('southside_service_is_active');
                    localStorage.removeItem('southside_service_start');
                    localStorage.removeItem('southside_service_heartbeat');
                    
                    showNotification("Service clôturé automatiquement suite à la fermeture de la page.", "warning");
                }
            }, []);

            // B. Heartbeat (Sauvegarde l'état toutes les 5 sec pour permettre l'auto-stop)
            useEffect(() => {
                if (isServiceActive && serviceStartTime) {
                    const interval = setInterval(() => {
                        localStorage.setItem('southside_service_heartbeat', Date.now().toString());
                    }, 5000);
                    return () => clearInterval(interval);
                }
            }, [isServiceActive, serviceStartTime]);

            // 2. Data Subscriptions & Offline Fallback with LOCAL STORAGE
            useEffect(() => {
                // If offline mode is forced (e.g. auth failed), load local
                if (isOffline) {
                    const loadLocal = (key, fallback) => {
                        try {
                            const item = localStorage.getItem(`southside_${key}`);
                            return item ? JSON.parse(item) : fallback;
                        } catch (e) {
                            console.error("Local storage read error", e);
                            return fallback;
                        }
                    };

                    setInvoices(loadLocal('invoices', INITIAL_INVOICES));
                    setEmployees(loadLocal('employees', INITIAL_EMPLOYEES));
                    setContracts(loadLocal('contracts', INITIAL_CONTRACTS));
                    setApplications(loadLocal('applications', INITIAL_APPLICATIONS));
                    setGrades(loadLocal('grades', INITIAL_GRADES));
                    setPrices(loadLocal('prices', INITIAL_GARAGE_PRICES));
                    setConfig(loadLocal('config', INITIAL_CONFIG));
                    setTheme(loadLocal('theme', INITIAL_THEME));
                    setCustomMessages(loadLocal('customMessages', INITIAL_MESSAGES));
                    // Charger les logs en mode offline si pas déjà fait
                    if(!serviceLogs.length) setServiceLogs(loadLocal('service_logs', []));
                    return;
                }

                if (!authUser) return;

                // --- Collections ---
                // Helper to handle permission errors
                const handleSnapshotError = (err) => {
                    console.error("Firestore Error:", err);
                    if (err.code === 'permission-denied') {
                        setIsOffline(true); // Fallback to offline mode
                        setNotification({ msg: "Accès refusé par Firebase (Permission Denied). Passage en mode hors-ligne pour continuer.", type: 'error' });
                    }
                };

                const unsubInvoices = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'invoices'), (snap) => {
                    setInvoices(snap.docs.map(d => ({ id: d.id, ...d.data(), docId: d.id })).sort((a,b) => new Date(b.date) - new Date(a.date)));
                }, handleSnapshotError);
                
                const unsubEmployees = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), (snap) => {
                    const empList = snap.docs.map(d => ({ ...d.data(), docId: d.id }));
                    setEmployees(empList);
                    if (snap.empty) {
                        INITIAL_EMPLOYEES.forEach(emp => addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), emp));
                    }
                }, handleSnapshotError);

                const unsubContracts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'contracts'), (snap) => {
                    setContracts(snap.docs.map(d => ({ id: d.id, ...d.data(), docId: d.id })));
                }, handleSnapshotError);

                const unsubApps = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), (snap) => {
                    setApplications(snap.docs.map(d => ({ id: d.id, ...d.data(), docId: d.id })));
                }, handleSnapshotError);

                // --- Settings Documents ---
                const unsubGrades = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'grades'), (docSnap) => {
                    if (docSnap.exists()) setGrades(docSnap.data().list);
                    else setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'grades'), { list: INITIAL_GRADES });
                }, handleSnapshotError);

                const unsubPrices = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'prices'), (docSnap) => {
                    if (docSnap.exists()) setPrices(docSnap.data().list);
                    else setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'prices'), { list: INITIAL_GARAGE_PRICES });
                }, handleSnapshotError);

                const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (!data.services) {
                            data.services = [
                                { id: 'srv_repair', name: 'Réparation', costPercent: data.repairCostPercent || 50 },
                                { id: 'srv_custom', name: 'Custom', costPercent: data.customCostPercent || 20 },
                                { id: 'srv_clean', name: 'Nettoyage', costPercent: 0 },
                                { id: 'srv_tow', name: 'Dépannage', costPercent: 0 },
                                { id: 'srv_other', name: 'Autre', costPercent: 0 }
                            ];
                        }
                        setConfig(data);
                    } else {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), INITIAL_CONFIG);
                    }
                }, handleSnapshotError);

                const unsubTheme = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'theme'), (docSnap) => {
                    if (docSnap.exists()) setTheme(docSnap.data());
                    else setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'theme'), INITIAL_THEME);
                }, handleSnapshotError);

                const unsubMessages = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messages'), (docSnap) => {
                    if (docSnap.exists()) setCustomMessages(docSnap.data());
                    else setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messages'), INITIAL_MESSAGES);
                }, handleSnapshotError);

                return () => {
                    unsubInvoices(); unsubEmployees(); unsubContracts(); unsubApps();
                    unsubGrades(); unsubPrices(); unsubConfig(); unsubTheme(); unsubMessages();
                };
            }, [authUser, isOffline]);

            // --- LOCAL STORAGE EFFECTS FOR OFFLINE PERSISTENCE ---
            useEffect(() => { if (isOffline) localStorage.setItem('southside_invoices', JSON.stringify(invoices)); }, [invoices, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_employees', JSON.stringify(employees)); }, [employees, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_service_logs', JSON.stringify(serviceLogs)); }, [serviceLogs, isOffline]); // Ajout logs
            useEffect(() => { if (isOffline) localStorage.setItem('southside_contracts', JSON.stringify(contracts)); }, [contracts, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_applications', JSON.stringify(applications)); }, [applications, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_grades', JSON.stringify(grades)); }, [grades, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_prices', JSON.stringify(prices)); }, [prices, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_config', JSON.stringify(config)); }, [config, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_theme', JSON.stringify(theme)); }, [theme, isOffline]);
            useEffect(() => { if (isOffline) localStorage.setItem('southside_customMessages', JSON.stringify(customMessages)); }, [customMessages, isOffline]);


             // --- Sorting Logic ---
            const sortedEmployees = useMemo(() => {
                if (!grades.length) return employees;
                const gradeWeights = {};
                grades.forEach((g, i) => gradeWeights[g.name] = i);
                
                return [...employees].sort((a, b) => {
                    const weightA = gradeWeights[a.grade] !== undefined ? gradeWeights[a.grade] : 999;
                    const weightB = gradeWeights[b.grade] !== undefined ? gradeWeights[b.grade] : 999;
                    return weightA - weightB;
                });
            }, [employees, grades]);


            // --- Derived Statistics ---
            const weeklyStats = useMemo(() => {
                const start = getStartOfWeek(selectedDate);
                const end = getEndOfWeek(selectedDate);

                const weeklyInvoices = invoices.filter(inv => {
                    const invDate = new Date(inv.date);
                    return invDate >= start && invDate <= end;
                });

                const totalRevenue = weeklyInvoices.reduce((acc, curr) => acc + curr.price, 0);
                const totalProfit = weeklyInvoices.reduce((acc, curr) => acc + curr.profit, 0);
                const totalBonuses = weeklyInvoices.reduce((acc, curr) => acc + curr.bonus, 0);

                // Use sortedEmployees instead of employees to maintain grade order
                const employeeStats = sortedEmployees.map(emp => {
                    const empInvoices = weeklyInvoices.filter(inv => inv.employeeId === emp.id);
                    const revenue = empInvoices.reduce((acc, curr) => acc + curr.price, 0);
                    // AJOUT DU CALCUL DU PROFIT PAR EMPLOYÉ
                    const profit = empInvoices.reduce((acc, curr) => acc + (curr.profit || 0), 0);
                    const bonusTheorique = empInvoices.reduce((acc, curr) => acc + curr.bonus, 0);
                    
                    // --- NOUVEAU : CALCUL DES HEURES PAR EMPLOYÉ ---
                    const empLogs = serviceLogs.filter(log => {
                        const logDate = new Date(log.date);
                        return log.employeeId === emp.id && logDate >= start && logDate <= end;
                    });
                    const totalDurationMs = empLogs.reduce((acc, log) => acc + log.duration, 0);

                    return { ...emp, invoiceCount: empInvoices.length, revenue, profit, bonusTheorique, totalDurationMs };
                });

                const clientStats = {};
                weeklyInvoices.forEach(inv => {
                    if (!clientStats[inv.client]) clientStats[inv.client] = 0;
                    clientStats[inv.client] += inv.price;
                });
                const topClients = Object.entries(clientStats)
                    .map(([name, value]) => ({ name, value }))
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 5);

                const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
                const activityData = days.map((day, index) => {
                    const dayIndex = (index + 1) % 7; 
                    const val = weeklyInvoices.filter(i => new Date(i.date).getDay() === dayIndex).reduce((acc, curr) => acc + curr.price, 0);
                    return { name: day, ca: val };
                });

                const serviceDist = weeklyInvoices.reduce((acc, inv) => {
                    const type = inv.type === 'Réparation' ? 'Réparation' : 'Custom';
                    if(!acc[type]) acc[type] = 0;
                    acc[type] += inv.price;
                    return acc;
                }, {});
                const pieData = Object.entries(serviceDist).map(([name, value]) => ({ name, value }));
                
                return { totalRevenue, totalProfit, totalBonuses, employeeStats, topClients, activityData, pieData, weeklyInvoices };
            }, [invoices, sortedEmployees, selectedDate]);

            // --- CLIENT BASE STATS (MOVED TO TOP LEVEL TO FIX HOOK ERROR) ---
            const clientStats = useMemo(() => {
                const stats = {};
                invoices.forEach(inv => {
                    const name = inv.client.trim();
                    if (!stats[name]) {
                        stats[name] = {
                            name: name,
                            totalSpent: 0,
                            visitCount: 0,
                            lastVisit: inv.date,
                            firstVisit: inv.date
                        };
                    }
                    const client = stats[name];
                    client.totalSpent += (inv.price || 0);
                    client.visitCount += 1;
                    if (new Date(inv.date) > new Date(client.lastVisit)) client.lastVisit = inv.date;
                    if (new Date(inv.date) < new Date(client.firstVisit)) client.firstVisit = inv.date;
                });
                // TRI ALPHABÉTIQUE AU LIEU DU TOTAL DÉPENSÉ
                return Object.values(stats).sort((a, b) => a.name.localeCompare(b.name));
            }, [invoices]);

            const uniqueClients = useMemo(() => {
                return [...new Set(invoices.map(inv => inv.client))];
            }, [invoices]);

            // --- Actions ---

            const handlePrevWeek = () => {
                const newDate = new Date(selectedDate);
                newDate.setDate(newDate.getDate() - 7);
                setSelectedDate(newDate);
            };

            const handleNextWeek = () => {
                const newDate = new Date(selectedDate);
                newDate.setDate(newDate.getDate() + 7);
                setSelectedDate(newDate);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                
                if (employees.length === 0) {
                    setLoginError('Chargement des données... Veuillez patienter ou vérifier votre connexion.');
                    return;
                }

                const user = employees.find(
                    emp => emp.name.toLowerCase() === loginForm.username.toLowerCase() && emp.password === loginForm.password
                );

                if (user) {
                    // SAUVEGARDE DE SESSION
                    if (stayConnected) {
                        localStorage.setItem('southside_session_user', user.id);
                    } else {
                        localStorage.removeItem('southside_session_user');
                    }

                    setCurrentUser(user);
                    setDashboardTargetUser(user); 
                    setLoginError('');
                    
                    showNotification(`Bienvenue ${user.name}.`);

                    if (user.role === 'admin') setActiveTab('dashboard');
                    else if (user.grade === 'Avocat') setActiveTab('hr'); 
                    else setActiveTab('personal');
                } else {
                    setLoginError('Nom ou mot de passe incorrect');
                }
            };

            const handleLogout = async () => {
                // Si en service, on coupe proprement avant de partir
                if (isServiceActive) handleToggleService();
                
                localStorage.removeItem('southside_session_user'); // Nettoyage de la session
                setCurrentUser(null);
                setDashboardTargetUser(null);
                setLoginForm({ username: '', password: '' });
                setStayConnected(false);
            };

            const handleToggleService = async () => {
                if (isServiceActive) {
                    // ARRET DU SERVICE
                    const endTime = Date.now();
                    const newLog = {
                        id: Date.now(),
                        employeeId: currentUser.id,
                        startTime: serviceStartTime,
                        endTime: endTime,
                        duration: endTime - serviceStartTime,
                        date: new Date().toISOString()
                    };
                    
                    const newLogs = [...serviceLogs, newLog];
                    setServiceLogs(newLogs);
                    setIsServiceActive(false);
                    setServiceStartTime(null);
                    
                    // Mise à jour BDD
                    await updateServiceStatus(currentUser.id, false);
                    
                    // Nettoyage LocalStorage
                    localStorage.setItem('southside_service_logs', JSON.stringify(newLogs));
                    localStorage.removeItem('southside_service_is_active');
                    localStorage.removeItem('southside_service_start');
                    localStorage.removeItem('southside_service_heartbeat');
                    
                    showNotification("Fin de service enregistrée.");
                } else {
                    // PRISE DE SERVICE
                    const start = Date.now();
                    setIsServiceActive(true);
                    setServiceStartTime(start);
                    
                    // Mise à jour BDD
                    await updateServiceStatus(currentUser.id, true);
                    
                    // Init LocalStorage pour Auto-stop
                    localStorage.setItem('southside_service_is_active', 'true');
                    localStorage.setItem('southside_service_start', start.toString());
                    localStorage.setItem('southside_service_heartbeat', start.toString());
                    
                    showNotification("Prise de service validée. Bon courage !");
                }
            };

            const formatDuration = (ms) => {
                const totalMinutes = Math.floor(ms / 60000);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${hours}h ${minutes.toString().padStart(2, '0')}`;
            };

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleSubmitApplication = async () => {
                if(!applicationForm.name) { showNotification("Veuillez remplir tous les champs", 'error'); return; }
                const newApp = { ...applicationForm, date: new Date().toISOString() };
                
                if (isOffline) {
                    setApplications(prev => [...prev, { ...newApp, id: `app${Date.now()}` }]);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'applications'), newApp);
                }
                setApplicationForm({ name: '', dob: '', motivation: '', ageHRP: '', availability: '', phoneRP: '', discord: '' });
                setAuthMode('login');
                showNotification("Votre candidature a été envoyée !", "success");
            };

            const handleAcceptApplication = async (app) => {
                const id = `e${Date.now().toString().slice(-4)}`;
                const newEmp = { id, name: app.name, grade: 'Apprenti', role: 'user', password: '123', dob: app.dob, contractUrl: '', iban: '' };
                
                if (isOffline) {
                    setEmployees(prev => [...prev, newEmp]);
                    setApplications(prev => prev.filter(a => a.id !== app.id));
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), newEmp);
                    const docRefId = app.docId || app.id;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', docRefId));
                }
                showNotification(`${app.name} a été recruté comme Apprenti !`);
            };

            const handleRejectApplication = async (id) => {
                if (isOffline) {
                    setApplications(prev => prev.filter(a => a.id !== id));
                } else {
                    const app = applications.find(a => a.id === id);
                    const docRefId = app?.docId || id;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'applications', docRefId));
                }
                showNotification("Candidature refusée.");
            };

            const calculateInvoiceMetrics = (type, price) => {
                const p = parseFloat(price) || 0;
                // Recherche dynamique du coût selon le service configuré
                const service = (config.services || []).find(s => s.name === type);
                const costPercent = service ? service.costPercent : 0;
                
                const totalCost = p * (costPercent / 100);
                const netProfit = p - totalCost;
                return { totalCost, netProfit, costPercent };
            };

            const handleCreateInvoice = async () => {
                if (!newInvoice.client || !newInvoice.type || !newInvoice.price) {
                    showNotification("Veuillez remplir les champs obligatoires", 'error');
                    return;
                }
                const price = parseFloat(newInvoice.price);
                const metrics = calculateInvoiceMetrics(newInvoice.type, price);
                const gradeInfo = grades.find(g => g.name === currentUser.grade);
                
                // --- NOUVELLE LOGIQUE DE PRIME ---
                // 1. Chercher la config du service
                const serviceConfig = (config.services || []).find(s => s.name === newInvoice.type);
                
                // 2. Déterminer le pourcentage de prime
                // Si le service a un bonusPercent défini (et non vide), on l'utilise. Sinon, on utilise celui du grade.
                let bonusRate = gradeInfo ? gradeInfo.primePercent : 0;
                if (serviceConfig && serviceConfig.bonusPercent !== undefined && serviceConfig.bonusPercent !== "" && serviceConfig.bonusPercent !== null) {
                    bonusRate = parseFloat(serviceConfig.bonusPercent);
                }

                // 3. Calculer la prime sur le Bénéfice Net
                const bonus = (metrics.netProfit > 0) ? (metrics.netProfit * bonusRate / 100) : 0;

                const invoiceEntry = {
                    date: new Date().toISOString(),
                    client: newInvoice.client,
                    type: newInvoice.type,
                    price: price,
                    profit: metrics.netProfit,
                    bonus: bonus,
                    employeeId: currentUser.id,
                    employeeName: currentUser.name
                };
                
                if (isOffline) {
                    setInvoices(prev => [{ ...invoiceEntry, id: Date.now() }, ...prev]);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'invoices'), invoiceEntry);
                }
                setNewInvoice({ client: '', type: '', price: '' }); 
                showNotification("Facture enregistrée !");
            };

            // --- UPDATE CLIENT NAME FUNCTION (Individual Invoice) ---
            const handleUpdateInvoiceClient = async (id) => {
                if (!editingClientName.trim()) return;
                
                if (isOffline) {
                    setInvoices(prev => prev.map(inv => inv.id === id ? { ...inv, client: editingClientName } : inv));
                } else {
                    const inv = invoices.find(i => i.id === id);
                    const docRefId = inv?.docId || id;
                    try {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invoices', docRefId), { client: editingClientName });
                    } catch (e) {
                        console.error("Error updating invoice:", e);
                        showNotification("Erreur lors de la modification", "error");
                        return;
                    }
                }
                setEditingInvoiceId(null);
                setEditingClientName('');
                showNotification("Nom du client modifié !");
            };

            // --- RENAME GLOBAL CLIENT FUNCTION ---
            const handleRenameClientGlobal = async () => {
                if (!renameValue.trim() || !selectedClient) return;
                const oldName = selectedClient.name;
                const newName = renameValue.trim();

                if (oldName === newName) {
                    setIsRenamingClient(false);
                    return;
                }

                // 1. Update Local State (Optimistic)
                const updatedInvoices = invoices.map(inv => {
                    if (inv.client.trim() === oldName) {
                        return { ...inv, client: newName };
                    }
                    return inv;
                });
                setInvoices(updatedInvoices); // Update UI immediately

                // 2. Update Firestore (Batch)
                if (!isOffline) {
                    try {
                        const batch = writeBatch(db);
                        // Find all invoices matching the old name using the IDs we already have loaded
                        const invoicesToUpdate = invoices.filter(inv => inv.client.trim() === oldName);
                        
                        invoicesToUpdate.forEach(inv => {
                            // Use docId if available, otherwise fallback to id (offline/mock)
                            const refId = inv.docId || inv.id.toString();
                            // Only attempt update if it looks like a valid Firestore ID (string) or handled by offline logic
                            if (refId) {
                                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'invoices', refId);
                                batch.update(docRef, { client: newName });
                            }
                        });
                        await batch.commit();
                        showNotification(`Client renommé en "${newName}" avec succès.`);
                    } catch (e) {
                        console.error("Batch update failed", e);
                        showNotification("Erreur sauvegarde cloud. Changement local uniquement.", "error");
                    }
                }

                // 3. Update Selection Context
                setSelectedClient(prev => ({ ...prev, name: newName }));
                setIsRenamingClient(false);
                setRenameValue('');
            };

            const handleDeleteInvoice = async (id) => {
                if (window.confirm("Supprimer cette facture ?")) {
                    if (isOffline) {
                        setInvoices(prev => prev.filter(inv => inv.id !== id));
                    } else {
                        const inv = invoices.find(i => i.id === id);
                        const docRefId = inv?.docId || id;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'invoices', docRefId));
                    }
                    showNotification("Facture supprimée");
                }
            };

            const handleAddEmployee = async () => {
                if (!newEmployee.name || !newEmployee.grade) return;
                const id = `e${Date.now().toString().slice(-4)}`;
                const newEmp = {
                    id, name: newEmployee.name, grade: newEmployee.grade, role: 'user', password: '123',
                    dob: newEmployee.dob, contractUrl: newEmployee.contractUrl, iban: newEmployee.iban
                };
                if (isOffline) {
                    setEmployees(prev => [...prev, newEmp]);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), newEmp);
                }
                setNewEmployee({ name: '', grade: '', dob: '', contractUrl: '', iban: '' });
                showNotification(`Employé ajouté.`);
            };

            // FIX: Using docId for deletion
            const handleFireEmployee = async (idToDelete) => {
                if (isOffline) {
                    setEmployees(prev => prev.filter(e => e.id !== idToDelete));
                } else {
                    const emp = employees.find(e => e.id === idToDelete);
                    if (!emp) return;
                    const docRefId = emp.docId || idToDelete;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', docRefId));
                }
                showNotification("L'employé a été licencié et ses accès révoqués.", "success");
            };

            // FIX: Using docId for update
            const handleSaveEdit = async () => {
                if (isOffline) {
                    setEmployees(prev => prev.map(emp => emp.id === editingEmployee.id ? editingEmployee : emp));
                } else {
                    // Extract docId to use as ref, but also keep it out of data if desired, 
                    // though usually storing it back is harmless.
                    const docRefId = editingEmployee.docId || editingEmployee.id;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', docRefId), editingEmployee);
                }
                setEditingEmployee(null);
                showNotification("Informations mises à jour !");
            };

            const handleUpdateGrade = async (gradeId, field, value) => {
                const newGrades = grades.map(g => g.id === gradeId ? { ...g, [field]: value } : g);
                if (isOffline) {
                    setGrades(newGrades);
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'grades'), { list: newGrades });
                }
            };

            const handleAddGrade = async () => {
                const newGrade = { id: `g_${Date.now()}`, name: 'Nouveau Grade', primePercent: 0, maxSalary: 0, quota: 0 };
                const newGrades = [...grades, newGrade];
                if (isOffline) {
                    setGrades(newGrades);
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'grades'), { list: newGrades });
                }
            };

            const handleDeleteGrade = async (gradeId) => {
                if(window.confirm("Supprimer ce grade ?")) {
                    const newGrades = grades.filter(g => g.id !== gradeId);
                    if (isOffline) {
                        setGrades(newGrades);
                    } else {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'grades'), { list: newGrades });
                    }
                }
            };

            const handlePriceChange = async (categoryIndex, itemIndex, field, value) => {
                const newPrices = prices.map((cat, i) => {
                    if (i === categoryIndex) {
                        return {
                            ...cat,
                            items: cat.items.map((item, j) => j === itemIndex ? { ...item, [field]: value } : item)
                        };
                    }
                    return cat;
                });
                setPrices(newPrices);
                if (!isOffline) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'prices'), { list: newPrices });
                }
            };
            
            const handleAddItem = async (categoryIndex) => {
                const newPrices = prices.map((cat, i) => {
                    if (i === categoryIndex) return { ...cat, items: [...cat.items, { name: 'Nouvelle pièce', price: 0 }] };
                    return cat;
                });
                setPrices(newPrices);
                if (!isOffline) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'prices'), { list: newPrices });
                }
            };

            const handleDeleteItem = async (categoryIndex, itemIndex) => {
                const newPrices = prices.map((cat, i) => {
                    if (i === categoryIndex) return { ...cat, items: cat.items.filter((_, j) => j !== itemIndex) };
                    return cat;
                });
                setPrices(newPrices);
                if (!isOffline) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'prices'), { list: newPrices });
                }
            };

            // --- Contracts Logic ---
            const handleAddTempDoc = () => {
                if(tempDoc.name && tempDoc.url) {
                    setNewContract({ ...newContract, supplementaryDocs: [...newContract.supplementaryDocs, tempDoc] });
                    setTempDoc({ name: '', url: '' });
                }
            };

            const handleSaveContract = async () => {
                if (!newContract.company || !newContract.date) return;
                
                if (editingContractId) {
                    if (isOffline) {
                        setContracts(prev => prev.map(c => c.id === editingContractId ? { ...newContract, id: editingContractId } : c));
                    } else {
                        const contract = contracts.find(c => c.id === editingContractId);
                        const docRefId = contract?.docId || editingContractId;
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'contracts', docRefId), newContract);
                    }
                    setEditingContractId(null);
                    showNotification("Contrat modifié avec succès.");
                } else {
                    if (isOffline) {
                        setContracts(prev => [...prev, { ...newContract, id: `c${Date.now()}` }]);
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'contracts'), newContract);
                    }
                    showNotification("Contrat ajouté avec succès.");
                }
                setNewContract({ company: '', date: '', endDate: '', description: '', url: '', supplementaryDocs: [] });
            };

            const handleEditContractClick = (contract) => {
                setNewContract({
                    company: contract.company,
                    date: contract.date,
                    endDate: contract.endDate || '',
                    description: contract.description,
                    url: contract.url,
                    supplementaryDocs: contract.supplementaryDocs || []
                });
                setEditingContractId(contract.id);
            };

            const handleCancelContractEdit = () => {
                setEditingContractId(null);
                setNewContract({ company: '', date: '', endDate: '', description: '', url: '', supplementaryDocs: [] });
            }

            const handleDeleteContract = async (id) => {
                if (deleteConfirmId === id) {
                    if (isOffline) {
                        setContracts(prev => prev.filter(c => c.id !== id));
                    } else {
                        const contract = contracts.find(c => c.id === id);
                        const docRefId = contract?.docId || id;
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'contracts', docRefId));
                    }
                    showNotification("Contrat supprimé.");
                    setDeleteConfirmId(null);
                } else {
                    setDeleteConfirmId(id);
                    setTimeout(() => setDeleteConfirmId(prev => prev === id ? null : prev), 3000); 
                }
            };

            const handleCopyText = (text) => {
                navigator.clipboard.writeText(text);
                showNotification("Message copié !", "success");
            }

            // --- SETTINGS SAVE ---
            const saveCustomMessages = async () => {
                if (isOffline) {
                    setCustomMessages({...customMessages});
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'messages'), customMessages);
                }
                setIsEditingMessages(false);
                showNotification("Messages sauvegardés.");
            }

            const saveConfig = async (key, val) => {
                const newConf = { ...config, [key]: val };
                setConfig(newConf); // Optimistic
                if (!isOffline) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), newConf);
                }
            }

            const saveTheme = async (newTheme) => {
                setTheme(newTheme); // Optimistic
                if (!isOffline) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'theme'), newTheme);
                }
                showNotification("Thème mis à jour !");
            };
            
            // --- RESET LOGIC ---
            const handleResetStats = async () => {
                if (isOffline) {
                    setInvoices([]);
                    // Also clear local storage for these keys
                    localStorage.removeItem('southside_invoices');
                } else {
                    const invoicesQ = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'invoices'));
                    const batch = writeBatch(db);
                    invoicesQ.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                }
                setConfirmReset(false);
                showNotification("Toutes les statistiques ont été remises à zéro.", "success");
            };

            // --- Navigation ---
            const handleNavClick = (tabId) => {
                setActiveTab(tabId);
                if (tabId === 'personal' && dashboardTargetUser?.id !== currentUser?.id) {
                    setDashboardTargetUser(currentUser);
                }
                if (window.innerWidth < 1024) setIsSidebarOpen(false);
            };

            const handleViewEmployeeStats = (employee) => {
                setDashboardTargetUser(employee);
                setActiveTab('personal');
            };
            
            // Helper to get grade color
            const getGradeColor = (grade) => {
                const lowerGrade = grade?.toLowerCase() || '';
                if (lowerGrade.includes('patron') && !lowerGrade.includes('co')) return 'red';
                if (lowerGrade.includes('co-patron')) return 'amber';
                if (lowerGrade.includes('avocat')) return 'purple';
                if (lowerGrade.includes('chef')) return 'blue';
                if (lowerGrade.includes('mécano')) return 'green';
                return 'gray';
            };

            // --- RENDERERS ---

            const renderAuthScreen = (
                <div className="min-h-screen bg-[#050505] text-gray-200 font-sans flex items-center justify-center p-4">
                    <div className={`absolute top-0 left-0 w-full h-96 bg-${theme.primaryColor}-900/20 blur-[120px] pointer-events-none`}></div>
                    <div className={`absolute bottom-0 right-0 w-96 h-96 bg-${theme.secondaryColor || 'violet'}-900/10 blur-[100px] pointer-events-none`}></div>

                    <GlassCard className="w-full max-w-md p-8 relative overflow-hidden animate-fadeIn">
                        <div className="text-center mb-8">
                            <div className={`w-16 h-16 rounded-2xl bg-gradient-to-br from-${theme.secondaryColor || 'violet'}-500 to-${theme.primaryColor}-600 flex items-center justify-center text-white shadow-lg shadow-${theme.primaryColor}-500/30 mx-auto mb-4`}>
                                <Wallet size={32} />
                            </div>
                            <h1 className="text-2xl font-black text-white tracking-tight">{theme.appName.split(' ')[0]} <span className={`text-${theme.primaryColor}-500`}>{theme.appName.split(' ').slice(1).join(' ')}</span></h1>
                            <p className="text-sm text-gray-500 mt-2">Enterprise Resource Planning</p>
                        </div>

                        {authMode === 'login' ? (
                            <>
                                <form onSubmit={handleLogin} className="space-y-6">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1 mb-2 block">Identifiant</label>
                                            <div className="relative group">
                                                <User className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 w-5 h-5" />
                                                <input type="text" placeholder="Nom et Prénom (ex: Edy Thomas)" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className={`w-full bg-black/40 border border-gray-700 rounded-xl py-3 pl-12 pr-4 text-white focus:border-${theme.primaryColor}-500 focus:ring-2 focus:ring-${theme.primaryColor}-500/20 outline-none transition-all`} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1 mb-2 block">Mot de passe</label>
                                            <div className="relative group">
                                                <Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 w-5 h-5" />
                                                <input type="password" placeholder="Code d'accès" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className={`w-full bg-black/40 border border-gray-700 rounded-xl py-3 pl-12 pr-4 text-white focus:border-${theme.primaryColor}-500 focus:ring-2 focus:ring-${theme.primaryColor}-500/20 outline-none transition-all`} />
                                            </div>
                                        </div>
                                    </div>
                                    {loginError && <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-center gap-2 text-red-400 text-sm"><AlertCircle size={16} />{loginError}</div>}
                                    
                                    {/* CHECKBOX RESTER CONNECTÉ */}
                                    <div className="flex items-center gap-3 pl-1 cursor-pointer w-fit" onClick={() => setStayConnected(!stayConnected)}>
                                        <div className={`w-5 h-5 rounded border flex items-center justify-center transition-all ${stayConnected ? `bg-${theme.primaryColor}-500 border-${theme.primaryColor}-500` : 'border-gray-600 bg-black/40 hover:border-gray-500'}`}>
                                            {stayConnected && <CheckCircle size={14} className="text-white" strokeWidth={3} />}
                                        </div>
                                        <label className="text-sm text-gray-400 select-none cursor-pointer font-medium hover:text-white transition-colors">Rester connecté</label>
                                    </div>

                                    <Button type="submit" className="w-full py-4 text-lg" color={theme.primaryColor}>Se connecter</Button>
                                </form>
                                
                                <div className="mt-8 pt-6 border-t border-gray-800/50">
                                    <p className="text-gray-500 text-xs text-center mb-3 uppercase tracking-wider font-bold">Pas encore employé ?</p>
                                    <button 
                                        onClick={() => setAuthMode('apply')} 
                                        className={`w-full py-3.5 rounded-xl border-2 border-dashed border-${theme.primaryColor}-500/30 hover:border-${theme.primaryColor}-500 text-${theme.primaryColor}-400 hover:text-white hover:bg-${theme.primaryColor}-500/10 transition-all duration-300 font-bold text-sm flex items-center justify-center gap-2 group`}
                                    >
                                        <div className={`p-1.5 rounded-lg bg-${theme.primaryColor}-500/20 group-hover:bg-${theme.primaryColor}-500 group-hover:text-white transition-colors`}>
                                            <Briefcase size={16} />
                                        </div>
                                        Déposer une candidature
                                    </button>
                                </div>
                            </>
                        ) : (
                            <div className="space-y-6 animate-fadeIn">
                                <div>
                                    <button onClick={() => setAuthMode('login')} className="flex items-center gap-2 text-gray-500 hover:text-white mb-4 text-sm"><ChevronLeft size={16}/> Retour connexion</button>
                                    <h3 className="text-xl font-bold text-white mb-2">Rejoindre l'équipe</h3>
                                    <p className="text-sm text-gray-400">Remplissez ce formulaire pour envoyer votre dossier au patron.</p>
                                </div>
                                <div className="space-y-4">
                                    <Input label="Nom et Prénom" placeholder="Ex: John Doe" value={applicationForm.name} onChange={(e) => setApplicationForm({...applicationForm, name: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <Input label="Date de naissance (RP)" type="date" value={applicationForm.dob} onChange={(e) => setApplicationForm({...applicationForm, dob: e.target.value})} />
                                        <Input label="Age HRP" type="number" placeholder="Ex: 20" value={applicationForm.ageHRP} onChange={(e) => setApplicationForm({...applicationForm, ageHRP: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <Input label="Numéro Tél RP" placeholder="Ex: 555-1234" value={applicationForm.phoneRP} onChange={(e) => setApplicationForm({...applicationForm, phoneRP: e.target.value})} />
                                        <Input label="Pseudo Discord" placeholder="Ex: user#1234" value={applicationForm.discord} onChange={(e) => setApplicationForm({...applicationForm, discord: e.target.value})} />
                                    </div>
                                    <Input label="Disponibilités" placeholder="Ex: Soirs semaine, Week-end..." value={applicationForm.availability} onChange={(e) => setApplicationForm({...applicationForm, availability: e.target.value})} />
                                    <div>
                                        <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1 mb-2 block">Motivation</label>
                                        <textarea 
                                            className={`w-full bg-black/40 border border-gray-700 rounded-xl py-3 px-4 text-white focus:border-${theme.primaryColor}-500 focus:ring-2 focus:ring-${theme.primaryColor}-500/20 outline-none transition-all h-24`}
                                            placeholder="Pourquoi voulez-vous nous rejoindre ?"
                                            value={applicationForm.motivation}
                                            onChange={(e) => setApplicationForm({...applicationForm, motivation: e.target.value})}
                                        ></textarea>
                                    </div>
                                </div>
                                <Button onClick={handleSubmitApplication} className="w-full py-3" variant="success"><Send size={18}/> Envoyer ma candidature</Button>
                            </div>
                        )}
                        {/* NOTIFICATION DANS LE LOGIN SCREEN */}
                        {notification && <div className={`fixed bottom-8 right-8 z-50 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 animate-slideUp backdrop-blur-xl border border-white/10 ${notification.type === 'error' ? 'bg-red-500/20 text-red-200' : 'bg-emerald-500/20 text-emerald-200'}`}><div><p className="font-bold text-white">{notification.type === 'error' ? 'Erreur' : 'Succès'}</p><p className="text-sm opacity-80">{notification.msg}</p></div></div>}
                    </GlassCard>
                </div>
            );

            const renderPersonalDashboard = () => {
                const targetUser = dashboardTargetUser || currentUser;
                const isViewingSelf = targetUser.id === currentUser.id;

                const myInvoices = weeklyStats.weeklyInvoices.filter(inv => inv.employeeId === targetUser.id);
                const myRevenue = myInvoices.reduce((acc, curr) => acc + curr.price, 0);
                // Calcul du bénéfice net personnel
                const myProfit = myInvoices.reduce((acc, curr) => acc + (curr.profit || 0), 0);
                const myBonusTheorique = myInvoices.reduce((acc, curr) => acc + curr.bonus, 0);
                
                const gradeInfo = grades.find(g => g.name === targetUser.grade);
                const maxSalary = gradeInfo ? gradeInfo.maxSalary : 0;
                
                // NOUVELLE LOGIQUE DE QUOTA : 1.5 x Salaire Max en Profit
                const targetProfit = maxSalary * 1.5;
                const progress = targetProfit > 0 ? Math.min((myProfit / targetProfit) * 100, 100) : 100;
                
                const isComplete = progress >= 100;
                const earnedSalary = maxSalary * (progress / 100);
                
                // CALCUL DES HEURES SEMAINE
                const startOfWeek = getStartOfWeek(selectedDate);
                const endOfWeek = getEndOfWeek(selectedDate);
                
                // On filtre les logs de la semaine pour l'utilisateur
                const weeklyLogs = serviceLogs.filter(log => {
                    const logDate = new Date(log.date);
                    return log.employeeId === targetUser.id && logDate >= startOfWeek && logDate <= endOfWeek;
                });
                
                // Somme des durées terminées
                let totalDurationMs = weeklyLogs.reduce((acc, log) => acc + log.duration, 0);
                
                // Si c'est l'utilisateur actuel et qu'il est en service, on ajoute le temps en cours
                if (isViewingSelf && isServiceActive && serviceStartTime) {
                    totalDurationMs += (Date.now() - serviceStartTime);
                }

                const myActivityData = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((day, index) => {
                    const val = myInvoices.filter(i => new Date(i.date).getDay() === (index + 1) % 7).reduce((acc, curr) => acc + curr.price, 0);
                    return { name: day, ca: val };
                });

                return (
                    <div className="animate-fadeIn space-y-8">
                        <WeekNavigator selectedDate={selectedDate} onPrev={handlePrevWeek} onNext={handleNextWeek} themeColor={theme.primaryColor} />
                        
                        <div className="flex flex-col md:flex-row justify-between items-end gap-4">
                            <div>
                                <h2 className="text-3xl font-black text-white tracking-tight flex items-center gap-3">
                                    {isViewingSelf ? `Bonjour, ${targetUser.name.split(' ')[0]} 👋` : `Fiche de ${targetUser.name}`}
                                    {!isViewingSelf && <span className={`text-sm bg-${theme.primaryColor}-500/20 text-${theme.primaryColor}-400 px-2 py-1 rounded border border-${theme.primaryColor}-500/30`}>Mode Supervision</span>}
                                </h2>
                                <p className="text-gray-400">Performances pour la semaine sélectionnée.</p>
                            </div>
                            
                            {/* BOUTON PRISE DE SERVICE (Uniquement pour soi-même) */}
                            {isViewingSelf && (
                                <div className="flex items-center gap-4 bg-gray-800/50 p-2 rounded-2xl border border-white/5">
                                    <div className="text-right px-2">
                                        <div className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Statut Service</div>
                                        <div className={`font-bold ${isServiceActive ? 'text-emerald-400' : 'text-red-400'}`}>
                                            {isServiceActive ? 'EN SERVICE' : 'HORS SERVICE'}
                                        </div>
                                    </div>
                                    <button 
                                        onClick={handleToggleService}
                                        className={`px-6 py-3 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2 ${
                                            isServiceActive 
                                            ? 'bg-red-500 hover:bg-red-600 text-white shadow-red-500/20' 
                                            : 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/20'

                                        {isServiceActive ? <WifiOff size={20}/> : <Wifi size={20}/>}
                                        {isServiceActive ? 'Fin de service' : 'Prise de service'}
                                    </button>
                                </div>

                            {!isViewingSelf && (
                                <div className="text-right">
                                    <div className="text-xs text-gray-500 uppercase tracking-wider mb-1">Grade Actuel</div>

                                </div>
                            )}
                        </div>

                         <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {/* CARTE HEURES */}
                            <GlassCard className="p-6 relative overflow-hidden bg-gradient-to-br from-gray-900 to-gray-800">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Heures Semaine</h3>
                                        <p className="text-3xl font-black text-white mt-1">{formatDuration(totalDurationMs)}</p>
                                    </div>
                                    <div className={`p-2 rounded-lg bg-blue-500/20 text-blue-400`}>
                                        <Clock size={24} />
                                    </div>
                                </div>
                                {isServiceActive && isViewingSelf && (
                                    <div className="flex items-center gap-2 text-xs text-emerald-400 animate-pulse">
                                        <div className="w-2 h-2 bg-emerald-500 rounded-full"></div>
                                        Compteur en cours...
                                    </div>
                                )}
                            </GlassCard>

                            <GlassCard className="p-6 relative overflow-hidden">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Objectif Rentabilité</h3>
                                        <div className="flex items-baseline gap-1 mt-1">
                                            <span className={`text-2xl font-black ${isComplete ? 'text-emerald-400' : 'text-white'}`}>${myProfit.toFixed(0)}</span>
                                            <span className="text-gray-500 text-sm">/ ${targetProfit.toFixed(0)}</span>
                                        </div>
                                    </div>
                                    <div className={`p-2 rounded-lg ${isComplete ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                        <Target size={24} />
                                    </div>
                                </div>
                                {targetProfit > 0 && (
                                    <>
                                        <div className="h-2 bg-gray-700 rounded-full overflow-hidden">
                                            <div className={`h-full transition-all duration-1000 ${isComplete ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{width: `${progress}%`}}></div>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-2 text-right">{Math.round(progress)}% validé</p>
                                    </>
                                )}
                            </GlassCard>
                            <GlassCard className="p-6">
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Chiffre d'Affaires</h3>
                                    <div className={`p-2 bg-${theme.primaryColor}-500/20 text-${theme.primaryColor}-400 rounded-lg`}>
                                        <Activity size={24} />
                                    </div>
                                </div>
                                <p className="text-3xl font-black text-white">${myRevenue.toLocaleString()}</p>
                                <p className="text-xs text-gray-500 mt-1">Total facturé</p>
                            </GlassCard>
                             <GlassCard className={`p-6 border-l-4 ${isComplete ? 'border-l-emerald-500' : 'border-l-amber-500'}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Paie Estimée</h3>
                                    <div className={`p-2 rounded-lg ${isComplete ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                        {isComplete ? <Unlock size={24} /> : <Lock size={24} />}
                                    </div>
                                </div>
                                <p className="text-3xl font-black text-white">${(earnedSalary + (isComplete ? myBonusTheorique : 0)).toLocaleString()}</p>
                                {!isComplete && (
                                    <div className="mt-2 flex items-center gap-2 text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded">
                                        <Lock size={12} /><span>Prime de ${myBonusTheorique.toFixed(0)} bloquée</span>
                                    </div>
                                )}
                                {isComplete && (
                                    <div className="mt-2 flex items-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded">
                                        <CheckCircle size={12} /><span>Prime débloquée !</span>
                                    </div>
                                )}
                            </GlassCard>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <GlassCard className="h-full flex flex-col">
                                    <div className="p-6 border-b border-gray-700/50">
                                        <h3 className="font-bold text-white">Factures de la semaine</h3>
                                    </div>
                                    <div className="flex-1 overflow-auto custom-scrollbar p-0">
                                        <table className="w-full text-left">
                                            <thead className="bg-gray-900/50 text-xs text-gray-500 uppercase sticky top-0">
                                                <tr>
                                                    <th className="p-4">Date</th>
                                                    <th className="p-4">Client</th>
                                                    <th className="p-4">Type</th>
                                                    <th className="p-4 text-right">Montant</th>
                                                    <th className="p-4 text-right">Ma Prime</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-800">
                                                {myInvoices.map(inv => (
                                                    <tr key={inv.id} className="hover:bg-white/5">
                                                        <td className="p-4 text-gray-400 text-xs">{new Date(inv.date).toLocaleDateString()}</td>
                                                        <td className="p-4 font-medium text-white">{inv.client}</td>
                                                        <td className="p-4"><StatusBadge color="gray">{inv.type}</StatusBadge></td>
                                                        <td className="p-4 text-right font-mono text-gray-300">${inv.price}</td>
                                                        <td className="p-4 text-right font-mono text-emerald-400">+${inv.bonus}</td>
                                                    </tr>
                                                ))}
                                                {myInvoices.length === 0 && (
                                                    <tr><td colSpan="5" className="p-6 text-center text-gray-500">Aucune facture cette semaine</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </GlassCard>
                            </div>
                            <GlassCard className="p-6 flex flex-col justify-center">
                                <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Activité Hebdo</h3>
                                <div className="h-48 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={myActivityData}>
                                            <Tooltip cursor={{fill: 'transparent'}} contentStyle={{backgroundColor:'#111827', borderColor:'#374151', color:'#fff', borderRadius:'8px'}} />
                                            <Bar dataKey="ca" fill="#6366f1" radius={[4, 4, 0, 0]} />
