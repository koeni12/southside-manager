                                                </td>
                                                <td className="p-5">
                                                    <div className="flex flex-col gap-2">
                                                        <div className="flex justify-between text-xs font-semibold">
                                                            <span className={isComplete ? "text-emerald-400" : "text-gray-400"}>${emp.profit.toFixed(0)} <span className="text-gray-600">/ ${targetProfit.toFixed(0)}</span></span>
                                                            <span className="text-white">{Math.round(progress)}%</span>
                                                        </div>
                                                        {targetProfit > 0 && (
                                                            <div className="h-2.5 bg-gray-800 rounded-full overflow-hidden shadow-inner">
                                                                <div className={`h-full rounded-full transition-all duration-1000 ease-out relative overflow-hidden ${isComplete ? 'bg-gradient-to-r from-emerald-500 to-teal-400' : `bg-gradient-to-r from-${theme.primaryColor}-500 to-${theme.secondaryColor || 'violet'}-500`}`} style={{width: `${progress}%`}}>
                                                                    <div className="absolute inset-0 bg-white/20 animate-pulse"></div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="p-5 text-right font-mono">
                                                    <div className="text-white font-medium">${earnedSalary.toFixed(0)}</div>
                                                    <div className="text-xs text-gray-600">Max: ${maxSalary}</div>
                                                </td>
                                                <td className="p-5 text-right">
                                                    {isComplete ? (
                                                        <div className="flex items-center justify-end gap-2 text-emerald-400 font-bold font-mono animate-fadeIn"><Unlock size={14} /> +${bonusAmount.toLocaleString()}</div>
                                                    ) : (
                                                        <div className="flex flex-col items-end animate-fadeIn">
                                                            <div className="flex items-center gap-2 text-amber-500 font-mono opacity-80"><Lock size={14} /> +${bonusAmount.toLocaleString()}</div>
                                                            <span className="text-[10px] text-amber-500/60 uppercase tracking-wide">Bloqué (Objectif non atteint)</span>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-5 text-right">
                                                    <div className={`inline-block px-3 py-1 rounded-lg border font-mono font-bold shadow-lg transition-colors ${isComplete ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100' : 'bg-gray-800 border-gray-700 text-white'}`}>
                                                        ${(earnedSalary + finalBonus).toLocaleString()}
                                                    </div>
                                                </td>
                                                <td className="p-5 text-center">
                                                    <button 
                                                        onClick={() => generatePaySlipPDF(emp, { baseSalary: earnedSalary, bonus: finalBonus, total: earnedSalary + finalBonus }, selectedDate, theme)}
                                                        className="p-2 bg-gray-800 hover:bg-white hover:text-black text-gray-400 rounded-lg transition-all border border-gray-700"
                                                        title="Télécharger Fiche de Paie"
                                                    >
                                                        <Download size={18}/>
                                                    </button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </GlassCard>
                </div>
            );

             const renderSettings = () => (
                 <div className="animate-fadeIn max-w-4xl mx-auto space-y-8">
                    <div>
                        <h2 className="text-3xl font-black text-white tracking-tight">Configuration</h2>
                        <p className="text-gray-400">Paramètres de l'entreprise.</p>
                    </div>
                    
                    {/* --- THEME CUSTOMIZATION --- */}
                    <GlassCard className={`p-6 border-t-4 border-t-${theme.secondaryColor || 'violet'}-500`}>
                        <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                            <Palette size={20} className={`text-${theme.secondaryColor || 'violet'}-400`}/> Personnalisation du Site
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <Input 
                                    label="Nom du Garage / Titre App" 
                                    value={theme.appName} 
                                    onChange={(e) => saveTheme({ ...theme, appName: e.target.value })} 
                                />
                                <p className="text-xs text-gray-500 mt-2">Ce nom apparaîtra sur la barre latérale et les factures.</p>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1 mb-2 block">Couleur Principale (Thème)</label>
                                <div className="flex flex-wrap gap-2">
                                    {THEME_COLORS.map(color => (
                                        <button
                                            key={color.name}
                                            onClick={() => saveTheme({ ...theme, primaryColor: color.name })}
                                            className={`w-8 h-8 rounded-full border-2 transition-all ${theme.primaryColor === color.name ? 'border-white scale-110 shadow-lg shadow-white/20' : 'border-transparent hover:scale-105'}`}
                                            style={{ backgroundColor: color.hex }}
                                            title={color.label}
                                        />
                                    ))}
                                </div>
                                <p className="text-xs text-gray-500 mt-2">Couleur utilisée pour les boutons, les icônes et les accents.</p>
                            </div>
                        </div>
                    </GlassCard>

                    {/* DYNAMIC SERVICE CONFIGURATION */}
                    <GlassCard className={`p-6 border-t-4 border-t-emerald-500`}>
                         <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                            <DollarSign size={20} className="text-emerald-400"/> Gestion des Prestations (Coûts & Taxes)
                        </h3>
                        <div className="space-y-4">
                            {config.services && config.services.map((service, index) => (
                                <div key={service.id || index} className="flex items-center gap-4 bg-gray-800/30 p-3 rounded-xl border border-gray-700/50">
                                    <div className="flex-1">
                                        <label className="text-xs text-gray-500 uppercase font-bold mb-1 block">Nom Prestation</label>
                                        <input 
                                            type="text" 
                                            value={service.name} 
                                            onChange={(e) => {
                                                const newServices = [...config.services];
                                                newServices[index].name = e.target.value;
                                                saveConfig('services', newServices);
                                            }}
                                            className={`bg-black/40 border border-gray-700 rounded-lg px-4 py-2 text-white w-full focus:border-emerald-500 outline-none`}
                                            placeholder="Nom prestation"
                                        />
                                    </div>
                                    <div className="w-1/4 relative">
                                        <label className="text-xs text-gray-500 uppercase font-bold mb-1 block">Coût / Taxe (%)</label>
                                        <input 
                                            type="number" 
                                            value={service.costPercent} 
                                            onChange={(e) => {
                                                const newServices = [...config.services];
                                                newServices[index].costPercent = parseFloat(e.target.value) || 0;
                                                saveConfig('services', newServices);
                                            }}
                                            className={`bg-black/40 border border-gray-700 rounded-lg px-4 py-2 text-white w-full pr-8 focus:border-emerald-500 outline-none font-mono`}
                                            placeholder="%"
                                        />
                                        <span className="absolute right-3 top-8 text-gray-500 pointer-events-none">%</span>
                                    </div>
                                    <div className="w-1/4 relative">
                                        <label className="text-xs text-gray-500 uppercase font-bold mb-1 block">Prime / Bonus (%)</label>
                                        <input 
                                            type="number" 
                                            value={service.bonusPercent ?? ''} 
                                            onChange={(e) => {
                                                const newServices = [...config.services];
                                                // Si vide, on met null pour utiliser le grade
                                                newServices[index].bonusPercent = e.target.value === '' ? null : parseFloat(e.target.value);
                                                saveConfig('services', newServices);
                                            }}
                                            className={`bg-black/40 border border-gray-700 rounded-lg px-4 py-2 text-white w-full pr-8 focus:border-emerald-500 outline-none font-mono placeholder-gray-600`}
                                            placeholder="Grade"
                                        />
                                        <span className="absolute right-3 top-8 text-gray-500 pointer-events-none">%</span>
                                    </div>
                                    <div className="pt-6">
                                        <button 
                                            onClick={() => {
                                                if(confirm("Supprimer cette prestation ?")) {
                                                    const newServices = config.services.filter((_, i) => i !== index);
                                                    saveConfig('services', newServices);
                                                }
                                            }}
                                            className="p-2 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition-all border border-red-500/20"
                                            title="Supprimer"
                                        >
                                            <Trash2 size={18} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                            
                            <button 
                                onClick={() => {
                                    const newServices = [...(config.services || []), { id: `srv_${Date.now()}`, name: 'Nouvelle Prestation', costPercent: 0, bonusPercent: null }];
                                    saveConfig('services', newServices);
                                }}
                                className="w-full py-3 mt-4 border-2 border-dashed border-gray-700 rounded-xl text-gray-400 hover:text-white hover:border-emerald-500 hover:bg-emerald-500/10 flex items-center justify-center gap-2 transition-all font-bold"
                            >
                                <Plus size={18} /> Ajouter un type de prestation
                            </button>
                        </div>
                    </GlassCard>

                    <GlassCard className="overflow-hidden">
                        <div className="px-6 py-4 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                            <h3 className="font-bold text-white">Grilles de Salaires</h3>
                        </div>
                        <table className="w-full text-left">
                            <thead>
                                <tr className="bg-gray-900/50 border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
                                    <th className="p-4 pl-6">Grade</th>
                                    <th className="p-4 text-center">Prime (%)</th>
                                    <th className="p-4 text-center">Salaire Max</th>
                                    <th className="p-4 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-800">
                                {grades.map(grade => (
                                    <tr key={grade.id} className="hover:bg-white/5 transition-colors">
                                        <td className="p-4 pl-6 font-bold text-white">
                                            <input 
                                                type="text" 
                                                value={grade.name} 
                                                onChange={(e) => handleUpdateGrade(grade.id, 'name', e.target.value)} 
                                                className={`bg-black/40 border border-gray-700 rounded-lg px-2 py-1 w-full text-white font-bold focus:border-${theme.primaryColor}-500 outline-none`}
                                            />
                                        </td>
                                        <td className="p-4 text-center">
                                            <input type="number" value={grade.primePercent} onChange={(e) => handleUpdateGrade(grade.id, 'primePercent', e.target.value === '' ? 0 : parseInt(e.target.value))} className={`bg-black/40 border border-gray-700 rounded-lg px-2 py-1 w-20 text-center text-${theme.primaryColor}-400 focus:border-${theme.primaryColor}-500 outline-none font-mono`} />
                                        </td>
                                        <td className="p-4 text-center">
                                            <input type="number" value={grade.maxSalary} onChange={(e) => handleUpdateGrade(grade.id, 'maxSalary', e.target.value === '' ? 0 : parseInt(e.target.value))} className="bg-black/40 border border-gray-700 rounded-lg px-2 py-1 w-24 text-center text-emerald-400 focus:border-emerald-500 outline-none font-mono" />
                                        </td>
                                        <td className="p-4 text-center">
                                            <button onClick={() => handleDeleteGrade(grade.id)} className="p-2 text-red-400 hover:text-white hover:bg-red-500/20 rounded-lg transition-colors"><Trash2 size={16} /></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="p-4 bg-gray-900/50 border-t border-gray-800">
                            <button onClick={handleAddGrade} className={`w-full py-2 border-2 border-dashed border-gray-700 rounded-lg text-gray-500 hover:text-white hover:border-${theme.primaryColor}-500 hover:bg-${theme.primaryColor}-500/10 flex items-center justify-center gap-2 transition-all font-bold`}>
                                <Plus size={16} /> Ajouter un Grade
                            </button>
                        </div>
                    </GlassCard>
                    
                    {/* New Danger Zone Card */}
                    <GlassCard className="p-6 border-t-4 border-t-red-500">
                         <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                            <AlertCircle size={20} className="text-red-500"/> Zone de Danger
                        </h3>
                        <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                            <p className="text-red-200 text-sm mb-4">
                                Cette action effacera définitivement tout l'historique des factures et remettra les compteurs du Dashboard et des employés à zéro.
                                <br/><strong>Cette action est irréversible.</strong>
                            </p>
                            
                            {!confirmReset ? (
                                <Button variant="danger" onClick={() => setConfirmReset(true)}>
                                    <Trash2 size={16} /> Réinitialiser toutes les statistiques
                                </Button>
                            ) : (
                                <div className="flex items-center gap-3 animate-fadeIn">
                                     <Button variant="secondary" onClick={() => setConfirmReset(false)}>
                                        Annuler
                                     </Button>
                                     <Button variant="danger" onClick={handleResetStats}>
                                        Confirmer la suppression
                                     </Button>
                                </div>
                            )}
                        </div>
                    </GlassCard>
                </div>
            );

            if (!currentUser) return renderAuthScreen;

            return (
                <div className="min-h-screen bg-[#050505] text-gray-200 font-sans selection:bg-indigo-500/30 flex overflow-hidden">
                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="lg:hidden fixed top-4 right-4 z-50 p-2 bg-gray-800 rounded-lg text-white shadow-lg border border-gray-700">{isSidebarOpen ? <X size={24} /> : <Menu size={24} />}</button>

                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#0a0a0a] border-r border-white/5 flex flex-col transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="p-8 pb-4">
                            <div className="flex items-center gap-3 mb-1">
                                <div className={`w-10 h-10 rounded-xl bg-gradient-to-br from-${theme.secondaryColor || 'violet'}-500 to-${theme.primaryColor}-600 flex items-center justify-center text-white shadow-lg shadow-${theme.primaryColor}-500/30`}><Wallet size={20} /></div>
                                <div><h1 className="text-xl font-black text-white tracking-tight">{theme.appName.split(' ')[0]} <span className={`text-${theme.primaryColor}-500`}>{theme.appName.split(' ').slice(1).join(' ')}</span></h1><p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Business Panel</p></div>
                            </div>
                        </div>

                        <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
                            <p className="px-4 text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Principal</p>
                            {/* Hide operation tabs for Lawyer */}
                            {currentUser.grade !== 'Avocat' && (
                                <>
                                    <NavItem tabId="facture" icon={Plus} label="Nouvelle Facture" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                    <NavItem tabId="personal" icon={User} label="Mon Espace" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} /> 
                                    <NavItem tabId="historique" icon={History} label="Historique" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                    <NavItem tabId="clients" icon={Users} label="Base Clients" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                </>
                            )}
                            
                            <NavItem tabId="contracts" icon={FileSignature} label="Contrats" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />

                            {currentUser.grade !== 'Avocat' && (
                                <>
                                    <NavItem tabId="tarifs" icon={Tag} label="Tarifs" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                    <NavItem tabId="aide" icon={HelpCircle} label="Aide & Commandes" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                </>
                            )}
                            
                            {/* Admin or Lawyer Access */}
                            {(currentUser.role === 'admin' || currentUser.grade === 'Avocat') && (
                                <>
                                    <p className="px-4 text-xs font-bold text-gray-600 uppercase tracking-wider mt-6 mb-2">Gestion</p>
                                    {currentUser.role === 'admin' && <NavItem tabId="dashboard" icon={LayoutDashboard} label="Dashboard Global" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />}
                                    <NavItem tabId="hr" icon={Briefcase} label="Ressources Humaines" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                    {currentUser.role === 'admin' && <NavItem tabId="salaires" icon={Award} label="Salaires & Primes" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />}
                                    {currentUser.role === 'admin' && (
                                        <>
                                            <p className="px-4 text-xs font-bold text-gray-600 uppercase tracking-wider mt-6 mb-2">Admin</p>
                                            <NavItem tabId="settings" icon={Settings} label="Configuration" activeTab={activeTab} onClick={handleNavClick} themeColor={theme.primaryColor} />
                                        </>
                                    )}
                                </>
                            )}
                        </nav>

                        <div className="p-4 border-t border-white/5 bg-white/2 mx-4 mb-4 rounded-2xl">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full bg-gray-700 border-2 border-gray-600 flex items-center justify-center"><span className="font-bold text-white text-xs">{currentUser.name.charAt(0)}</span></div>
                                <div className="flex-1 min-w-0">
                                    <p className="text-sm font-bold text-white truncate">{currentUser.name}</p>
                                    <StatusBadge color={getGradeColor(currentUser.grade)}>{currentUser.grade}</StatusBadge>
                                </div>
                                <button onClick={handleLogout} className="text-gray-500 hover:text-white transition-colors" title="Déconnexion"><LogOut size={18} /></button>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 relative h-screen overflow-hidden flex flex-col bg-gradient-to-br from-gray-900 via-black to-black">
                        <div className={`absolute top-0 left-0 w-full h-96 bg-${theme.primaryColor}-900/10 blur-[100px] pointer-events-none`}></div>
                        <div className={`absolute bottom-0 right-0 w-96 h-96 bg-${theme.secondaryColor || 'violet'}-900/10 blur-[100px] pointer-events-none`}></div>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-10 relative z-10">
                            {/* RENDER CONDITIONS */}
                            {activeTab === 'facture' && renderInvoiceForm()}
                            {activeTab === 'personal' && renderPersonalDashboard()}
                            {activeTab === 'historique' && renderHistory()}
                            {activeTab === 'clients' && renderClients()}
                            {activeTab === 'tarifs' && renderPrices()}
                            {activeTab === 'aide' && renderHelp()}
                            {(currentUser.role === 'admin' || currentUser.grade === 'Avocat') && activeTab === 'hr' && renderHR()}
                            {activeTab === 'contracts' && renderContracts()}
                            {currentUser.role === 'admin' && activeTab === 'dashboard' && renderDashboard()}
                            {currentUser.role === 'admin' && activeTab === 'salaires' && renderSalaries()}
                            {currentUser.role === 'admin' && activeTab === 'settings' && renderSettings()}
                        </div>
                        {notification && <div className={`fixed bottom-8 right-8 z-50 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 animate-slideUp backdrop-blur-xl border border-white/10 ${notification.type === 'error' ? 'bg-red-500/20 text-red-200' : 'bg-emerald-500/20 text-emerald-200'}`}><div><p className="font-bold text-white">{notification.type === 'error' ? 'Erreur' : 'Succès'}</p><p className="text-sm opacity-80">{notification.msg}</p></div></div>}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
