                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </GlassCard>
                        </div>
                    </div>
                );
            };

            const renderDashboard = () => (
                 <div className="animate-fadeIn space-y-8">
                    <WeekNavigator selectedDate={selectedDate} onPrev={handlePrevWeek} onNext={handleNextWeek} themeColor={theme.primaryColor} />
                    <div>
                        <h2 className="text-3xl font-black text-white tracking-tight">Dashboard</h2>
                        <p className="text-gray-400">Vue d'ensemble de la semaine sélectionnée.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <GlassCard className={`p-6 border-t-4 border-t-${theme.primaryColor}-500 relative overflow-hidden`}>
                            <div className="absolute top-0 right-0 p-4 opacity-5"><Activity size={80}/></div>
                            <h3 className={`text-${theme.primaryColor}-300 font-bold text-sm uppercase mb-2`}>Chiffre d'Affaires</h3>
                            <p className="text-4xl font-black text-white">${weeklyStats.totalRevenue.toLocaleString()}</p>
                        </GlassCard>
                        <GlassCard className="p-6 border-t-4 border-t-emerald-500 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-5"><TrendingUp size={80}/></div>
                            <h3 className="text-emerald-300 font-bold text-sm uppercase mb-2">Bénéfice Net</h3>
                            <p className="text-4xl font-black text-white">${weeklyStats.totalProfit.toLocaleString()}</p>
                        </GlassCard>
                        <GlassCard className={`p-6 border-t-4 border-t-${theme.secondaryColor || 'violet'}-500 relative overflow-hidden`}>
                             <div className="absolute top-0 right-0 p-4 opacity-5"><Award size={80}/></div>
                            <h3 className={`text-${theme.secondaryColor || 'violet'}-300 font-bold text-sm uppercase mb-2`}>Total Primes</h3>
                            <p className="text-4xl font-black text-white">${weeklyStats.totalBonuses.toLocaleString()}</p>
                        </GlassCard>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <GlassCard className="p-6">
                            <h3 className="text-white font-bold mb-6 flex items-center gap-2">
                                <TrendingUp size={18} className={`text-${theme.primaryColor}-400`}/> Revenus Hebdomadaires
                            </h3>
                            <div className="h-64">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={weeklyStats.activityData}>
                                        <defs>
                                            <linearGradient id="colorCa" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3}/>
                                                <stop offset="95%" stopColor="#6366f1" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#374151" vertical={false} />
                                        <XAxis dataKey="name" stroke="#9ca3af" axisLine={false} tickLine={false} />
                                        <YAxis stroke="#9ca3af" axisLine={false} tickLine={false} />
                                        <Tooltip contentStyle={{backgroundColor:'#111827', borderColor:'#374151', color:'#fff', borderRadius:'8px'}} />
                                        <Area type="monotone" dataKey="ca" stroke="#6366f1" strokeWidth={3} fillOpacity={1} fill="url(#colorCa)" />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
                        </GlassCard>
                        <GlassCard className="p-6">
                             <h3 className="text-white font-bold mb-6 flex items-center gap-2">
                                <PieIcon size={18} className="text-emerald-400"/> Répartition CA (Réparation vs Custom)
                            </h3>
                             <div className="h-64 flex items-center justify-center">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie data={weeklyStats.pieData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                            {weeklyStats.pieData.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.name === 'Réparation' ? '#10b981' : '#f59e0b'} stroke="none" />
                                            ))}
                                        </Pie>
                                        <Tooltip contentStyle={{backgroundColor:'#111827', borderColor:'#374151', color:'#fff', borderRadius:'8px'}} />
                                        <Legend />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </GlassCard>
                    </div>
                 </div>
            );
            
            const renderInvoiceForm = () => {
                const metrics = calculateInvoiceMetrics(newInvoice.type, newInvoice.price);
                return (
                <div className="max-w-6xl mx-auto animate-fadeIn">
                  <div className="flex flex-col md:flex-row justify-between items-end mb-8">
                    <div>
                      <h2 className="text-3xl font-black text-white mb-2 tracking-tight">Nouvelle Facture</h2>
                      <p className="text-gray-400">Saisie simplifiée. Connecté en tant que <strong className={`text-${theme.primaryColor}-400`}>{currentUser.name}</strong>.</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="lg:col-span-2">
                        <GlassCard className="p-8 relative overflow-hidden h-full">
                            <div className={`absolute -top-20 -right-20 w-64 h-64 bg-${theme.primaryColor}-500/10 rounded-full blur-3xl pointer-events-none`}></div>
                            <div className="grid grid-cols-1 gap-6 relative z-10">
                                <div>
                                    <Input label="Client" required placeholder="Rechercher..." list="client-suggestions" value={newInvoice.client} onChange={(e) => setNewInvoice({...newInvoice, client: e.target.value})} />
                                    <datalist id="client-suggestions">{uniqueClients.map((client, idx) => (<option key={idx} value={client} />))}</datalist>
                                </div>
                                <Select label="Type de Prestation" required options={(config.services || []).map(s => s.name)} value={newInvoice.type} onChange={(e) => setNewInvoice({...newInvoice, type: e.target.value})} />
                                <Input label="Prix Facturé ($)" required type="number" prefix="$" placeholder="0.00" value={newInvoice.price} onChange={(e) => setNewInvoice({...newInvoice, price: e.target.value})} />
                            </div>
                            <div className="mt-8">
                                <Button onClick={handleCreateInvoice} className="w-full py-4 text-lg" color={theme.primaryColor}><Save size={20} /> Enregistrer la facture</Button>
                            </div>
                        </GlassCard>
                    </div>
                    <div className="lg:col-span-1 space-y-6">
                        <GlassCard className="p-6 bg-gradient-to-br from-gray-900 to-gray-800">
                            <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                                <Calculator size={16} /> Estimation Rapide
                            </h3>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center pb-2 border-b border-gray-700/50">
                                    <span className="text-gray-400">Prix Facturé</span>
                                    <span className="font-mono text-white">${parseFloat(newInvoice.price || 0).toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between items-center text-sm">
                                    <span className="text-gray-500">
                                        Coût/Taxe ({metrics.costPercent}%)
                                    </span>
                                    <span className="font-mono text-red-400/70">-${metrics.totalCost.toFixed(2)}</span>
                                </div>
                                <div className="pt-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-white">Bénéfice Net</span>
                                        <span className={`font-mono font-bold text-xl ${metrics.netProfit >= 0 ? 'text-emerald-400' : 'text-red-500'}`}>
                                            {metrics.netProfit >= 0 ? '+' : ''}{metrics.netProfit.toFixed(2)} $
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </GlassCard>
                        <div className={`p-4 rounded-xl bg-${theme.primaryColor}-500/10 border border-${theme.primaryColor}-500/20 text-sm text-${theme.primaryColor}-200`}>
                            <p>Le taux de charges pour <strong>{newInvoice.type || 'cette prestation'}</strong> est fixé à <strong>{metrics.costPercent}%</strong>.</p>
                        </div>
                    </div>
                  </div>
                </div>
                );
            };

            const renderHistory = () => {
                const filteredInvoices = invoices.filter(inv => {
                  const matchesSearch = inv.client.toLowerCase().includes(historySearch.toLowerCase());
                  const matchesType = historyFilter ? inv.type === historyFilter : true;
                  return matchesSearch && matchesType;
                });

                const weeklyFilteredInvoices = weeklyStats.weeklyInvoices.filter(inv => {
                    const matchesSearch = inv.client.toLowerCase().includes(historySearch.toLowerCase());
                    const matchesType = historyFilter ? inv.type === historyFilter : true;
                    return matchesSearch && matchesType;
                });

                return (
                <div className="animate-fadeIn h-full flex flex-col">
                  <WeekNavigator selectedDate={selectedDate} onPrev={handlePrevWeek} onNext={handleNextWeek} themeColor={theme.primaryColor} />
                  <div className="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
                    <div>
                      <h2 className="text-3xl font-black text-white tracking-tight">Historique Hebdomadaire</h2>
                      <p className="text-gray-400">Archives de la semaine sélectionnée ({weeklyFilteredInvoices.length} factures)</p>
                    </div>
                    <div className="flex gap-2 w-full md:w-auto">
                         <div className="relative group flex-1 md:w-64">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4 group-focus-within:text-white transition-colors" />
                            <input 
                              type="text" 
                              placeholder="Rechercher un client..." 
                              value={historySearch}
                              onChange={(e) => setHistorySearch(e.target.value)}
                              className={`w-full bg-black/40 border border-gray-700 rounded-xl py-2 pl-10 pr-4 text-white focus:border-${theme.primaryColor}-500 focus:ring-1 focus:ring-${theme.primaryColor}-500/20 outline-none transition-all placeholder-gray-600`}
                            />
                         </div>
                         <div className="relative group w-40">
                            <Filter className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4" />
                            <select value={historyFilter} onChange={(e) => setHistoryFilter(e.target.value)} className={`w-full bg-black/40 border border-gray-700 rounded-xl py-2 pl-9 pr-8 text-white focus:border-${theme.primaryColor}-500 focus:ring-1 focus:ring-${theme.primaryColor}-500/20 appearance-none outline-none transition-all cursor-pointer`}>
                              <option value="">Tout voir</option>
                              {(config.services || []).map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                            </select>
                            <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500"><ChevronRight className="w-3 h-3 rotate-90" /></div>
                         </div>
                         <Button variant="secondary" className="bg-gray-800/50 px-3"><FileText size={16} /></Button>
                    </div>
                  </div>
                  <GlassCard className="flex-1 overflow-hidden flex flex-col">
                    <div className="overflow-auto custom-scrollbar flex-1">
                      <table className="w-full text-left border-collapse">
                        <thead className="sticky top-0 bg-gray-900/95 backdrop-blur-md z-10">
                          <tr className={`text-${theme.primaryColor}-300 text-xs uppercase tracking-wider border-b border-gray-800`}>
                            <th className="p-5 font-bold">Date</th>
                            <th className="p-5 font-bold">Client</th>
                            <th className="p-5 font-bold">Type</th>
                            <th className="p-5 font-bold text-right">Prix</th>
                            {isBoss && <th className="p-5 font-bold text-right">Bénéfice Net</th>}
                            <th className="p-5 font-bold">Employé</th>
                            {isBoss && <th className="p-5 font-bold text-center">Action</th>}
                            <th className="p-5 font-bold text-center">Reçu</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-800/50">
                          {weeklyFilteredInvoices.map((inv) => (
                            <tr key={inv.id} className={`hover:bg-${theme.primaryColor}-500/5 transition-colors group`}>
                              <td className="p-5 text-gray-300 text-sm">{new Date(inv.date).toLocaleDateString()}</td>
                              
                              {/* --- CLIENT EDITING UI --- */}
                              <td className="p-5 font-medium text-white">
                                  {editingInvoiceId === inv.id ? (
                                      <div className="flex items-center gap-2">
                                          <input 
                                              autoFocus
                                              className="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm text-white w-full focus:border-indigo-500 outline-none"
                                              value={editingClientName}
                                              onChange={(e) => setEditingClientName(e.target.value)}
                                              onClick={(e) => e.stopPropagation()}
                                              onKeyDown={(e) => {
                                                  if (e.key === 'Enter') handleUpdateInvoiceClient(inv.id);
                                                  if (e.key === 'Escape') { setEditingInvoiceId(null); setEditingClientName(''); }
                                              }}
                                          />
                                          <button onClick={(e) => { e.stopPropagation(); handleUpdateInvoiceClient(inv.id); }} className="text-emerald-400 hover:text-emerald-300"><CheckCircle size={16} /></button>
                                          <button onClick={(e) => { e.stopPropagation(); setEditingInvoiceId(null); setEditingClientName(''); }} className="text-red-400 hover:text-red-300"><XCircle size={16} /></button>
                                      </div>
                                  ) : (
                                      <div className="flex items-center justify-between group/edit">
                                          <span>{inv.client}</span>
                                          {(isBoss || inv.employeeId === currentUser.id) && (
                                              <button 
                                                  onClick={(e) => { e.stopPropagation(); setEditingInvoiceId(inv.id); setEditingClientName(inv.client); }} 
                                                  className="opacity-0 group-hover/edit:opacity-100 text-gray-500 hover:text-white transition-opacity"
                                                  title="Modifier le nom du client"
                                              >
                                                  <Edit size={14} />
                                              </button>
                                          )}
                                      </div>
                                  )}
                              </td>

                              <td className="p-5"><StatusBadge color="gray">{inv.type}</StatusBadge></td>
                              <td className="p-5 text-right font-mono text-gray-200 font-bold">${inv.price.toFixed(2)}</td>
                              {isBoss && (
                                  <td className={`p-5 text-right font-mono font-bold ${inv.profit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{inv.profit >= 0 ? '+' : ''}${inv.profit.toFixed(2)}</td>
                              )}
                              <td className="p-5 text-sm text-gray-400">{inv.employeeName}</td>
                              {isBoss && (
                                <td className="p-5 text-center">
                                  <button onClick={() => handleDeleteInvoice(inv.id)} className="p-2 rounded-lg hover:bg-red-500/10 text-gray-600 hover:text-red-500 transition-all"><Trash2 size={16} /></button>
                                </td>
                              )}
                              <td className="p-5 text-center">
                                  <button onClick={() => generateInvoicePDF(inv, theme)} className="p-2 bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-all" title="Télécharger PDF">
                                      <Download size={16}/>
                                  </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </GlassCard>
                </div>
                );
            };

            const renderPrices = () => (
                 <div className="animate-fadeIn max-w-5xl mx-auto">
                    <div className="mb-8 flex justify-between items-center">
                        <div>
                          <h2 className="text-3xl font-black text-white tracking-tight">Tarifs Garage</h2>
                          <p className="text-gray-400">Liste officielle des prestations.</p>
                        </div>
                        {isBoss && (
                            <button onClick={() => {
                                if (isEditingPrices) {
                                    setIsEditingPrices(false);
                                } else {
                                    setIsEditingPrices(true);
                                }
                            }} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${isEditingPrices ? 'bg-emerald-500 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'}`}>
                                {isEditingPrices ? <span className="flex items-center gap-2"><CheckCircle size={16}/> Terminer</span> : <span className="flex items-center gap-2"><Edit size={16}/> Modifier Tarifs</span>}
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {prices.map((category, catIdx) => (
                            <GlassCard key={catIdx} className="overflow-hidden">
                                <div className={`p-4 bg-${theme.primaryColor}-900/30 border-b border-${theme.primaryColor}-500/20`}>
                                    <h3 className="font-bold text-white text-lg flex items-center gap-2"><Tag size={18} className={`text-${theme.primaryColor}-400`}/> {category.category}</h3>
                                </div>
                                <div className="divide-y divide-gray-800">
                                    {category.items.map((item, itemIdx) => (
                                        <div key={itemIdx} className="p-4 flex justify-between items-center hover:bg-white/5 transition-colors">
                                            {isEditingPrices ? (
                                                <div className="flex items-center gap-2 w-full">
                                                    <input 
                                                      className="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm text-gray-300 w-full"
                                                      value={item.name}
                                                      onChange={(e) => handlePriceChange(catIdx, itemIdx, 'name', e.target.value)}
                                                    />
                                                    <input 
                                                      type="number"
                                                      className="bg-black/40 border border-gray-700 rounded px-2 py-1 text-sm text-white font-mono font-bold w-24 text-right"
                                                      value={item.price}
                                                      onChange={(e) => handlePriceChange(catIdx, itemIdx, 'price', e.target.value === '' ? 0 : parseFloat(e.target.value))}
                                                    />
                                                    <button onClick={() => handleDeleteItem(catIdx, itemIdx)} className="text-red-500 hover:text-red-400 p-1"><Trash2 size={16}/></button>
                                                </div>
                                            ) : (
                                                <>
                                                    <span className="text-gray-300">{item.name}</span>
                                                    <span className="font-mono font-bold text-white">${item.price}</span>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                    {isEditingPrices && (
                                        <div className="p-2">
                                            <button onClick={() => handleAddItem(catIdx)} className="w-full py-2 border-2 border-dashed border-gray-700 rounded-lg text-gray-500 hover:text-white hover:border-gray-500 text-sm flex items-center justify-center gap-2 transition-all">
                                                <Plus size={14} /> Ajouter une ligne
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </GlassCard>
                        ))}
                    </div>
                </div>
            );

            // --- RENDER CLIENTS (UPDATED: PROFILE VIEW & RENAME) ---
            const renderClients = () => {
                // Use clientStats which is now calculated at the top level
                const filteredClients = clientStats.filter(c => c.name.toLowerCase().includes(clientSearch.toLowerCase()));

                if (selectedClient) {
                    // Fix: Ensure we trim comparisons to catch all invoices
                    const clientInvoices = invoices
                        .filter(inv => inv.client.trim() === selectedClient.name)
                        .sort((a,b) => new Date(b.date) - new Date(a.date));
                        
                    const averageSpend = selectedClient.visitCount > 0 ? selectedClient.totalSpent / selectedClient.visitCount : 0;
                    
                    let badgeColor = 'gray';
                    let badgeText = 'Nouveau';
                    if (selectedClient.totalSpent > 20000) { badgeColor = 'amber'; badgeText = 'VIP'; }
                    else if (selectedClient.visitCount > 3) { badgeColor = 'blue'; badgeText = 'Régulier'; }

                    return (
                        <div className="animate-fadeIn space-y-6">
                            <button onClick={() => { setSelectedClient(null); setIsRenamingClient(false); }} className="flex items-center gap-2 text-gray-400 hover:text-white transition-colors mb-4 group">
                                <ChevronLeft size={20} className="group-hover:-translate-x-1 transition-transform" /> Retour à la liste
                            </button>

                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div className="flex items-center gap-4 w-full md:w-auto">
                                    <div className={`w-16 h-16 rounded-2xl bg-gradient-to-br from-${theme.primaryColor}-500 to-${theme.secondaryColor || 'violet'}-600 flex items-center justify-center text-white shadow-lg shrink-0`}>
                                        <User size={32} />
                                    </div>
                                    <div className="flex-1">
                                        {isRenamingClient ? (
                                            <div className="flex items-center gap-2">
                                                <input 
                                                    autoFocus
                                                    className="bg-black/40 border border-gray-700 rounded-xl px-3 py-2 text-xl font-bold text-white w-full md:w-64 focus:border-indigo-500 outline-none"
                                                    value={renameValue}
                                                    onChange={(e) => setRenameValue(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter') handleRenameClientGlobal();
                                                        if (e.key === 'Escape') setIsRenamingClient(false);
                                                    }}
                                                />
                                                <button onClick={handleRenameClientGlobal} className="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg hover:bg-emerald-500 hover:text-white transition-all"><CheckCircle size={20}/></button>
                                                <button onClick={() => setIsRenamingClient(false)} className="p-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500 hover:text-white transition-all"><XCircle size={20}/></button>
                                            </div>
                                        ) : (
                                            <h2 className="text-3xl font-black text-white tracking-tight flex items-center gap-3 group">
                                                {selectedClient.name}
                                                {isBoss && (
                                                    <button 
                                                        onClick={() => { setRenameValue(selectedClient.name); setIsRenamingClient(true); }}
                                                        className="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-white transition-opacity p-1"
                                                        title="Renommer ce client"
                                                    >
                                                        <Edit size={18} />
                                                    </button>
                                                )}
                                            </h2>
                                        )}
                                        <p className="text-gray-400 flex items-center gap-2">Client depuis le {new Date(selectedClient.firstVisit).toLocaleDateString()}</p>
                                    </div>
                                </div>
                                <StatusBadge color={badgeColor}>{badgeText}</StatusBadge>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <GlassCard className="p-6">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Total Dépensé</h3>
                                        <div className={`p-2 bg-${theme.primaryColor}-500/20 text-${theme.primaryColor}-400 rounded-lg`}><Wallet size={24}/></div>
                                    </div>
                                    <p className="text-3xl font-black text-white">${selectedClient.totalSpent.toLocaleString()}</p>
                                </GlassCard>
                                <GlassCard className="p-6">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Visites</h3>
                                        <div className="p-2 bg-blue-500/20 text-blue-400 rounded-lg"><History size={24}/></div>
                                    </div>
                                    <p className="text-3xl font-black text-white">{selectedClient.visitCount}</p>
                                </GlassCard>
                                <GlassCard className="p-6">
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-gray-400 text-xs font-bold uppercase tracking-wider">Panier Moyen</h3>
                                        <div className="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg"><Calculator size={24}/></div>
                                    </div>
                                    <p className="text-3xl font-black text-white">${averageSpend.toFixed(0)}</p>
                                </GlassCard>
                            </div>

                            <GlassCard className="overflow-hidden">
                                <div className="p-6 border-b border-gray-800 bg-gray-900/50 flex justify-between items-center">
                                    <h3 className="font-bold text-white">Historique des interventions</h3>
                                    <span className="text-xs text-gray-500">{clientInvoices.length} factures trouvées</span>
                                </div>
                                <div className="overflow-auto custom-scrollbar max-h-[500px]">
                                    <table className="w-full text-left">
                                        <thead className="bg-gray-900/50 text-xs text-gray-500 uppercase sticky top-0">
                                            <tr>
                                                <th className="p-4">Date</th>
                                                <th className="p-4">Prestation</th>
                                                <th className="p-4">Mécanicien</th>
                                                <th className="p-4 text-right">Montant</th>
                                                <th className="p-4 text-center">Reçu</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-800">
                                            {clientInvoices.length > 0 ? (
                                                clientInvoices.map(inv => (
                                                    <tr key={inv.id} className="hover:bg-white/5 transition-colors">
                                                        <td className="p-4 text-gray-400 text-sm">{new Date(inv.date).toLocaleDateString()}</td>
                                                        <td className="p-4"><StatusBadge color="gray">{inv.type}</StatusBadge></td>
                                                        <td className="p-4 text-white">{inv.employeeName}</td>
                                                        <td className="p-4 text-right font-mono text-white font-bold">${inv.price.toLocaleString()}</td>
                                                        <td className="p-4 text-center">
                                                            <button onClick={() => generateInvoicePDF(inv, theme)} className="p-2 bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-all" title="Télécharger PDF">
                                                                <Download size={16}/>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr><td colSpan="5" className="p-8 text-center text-gray-500 italic">Aucune facture trouvée pour ce nom exact.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </GlassCard>
                        </div>
                    );
                }

                return (
                    <div className="animate-fadeIn h-full flex flex-col">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
                            <div>
                                <h2 className="text-3xl font-black text-white tracking-tight">Base Clients</h2>
                                <p className="text-gray-400">Répertoire consolidé ({clientStats.length} clients uniques)</p>
                            </div>
                            <div className="relative group w-full md:w-64">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-4 h-4 group-focus-within:text-white transition-colors" />
                                <input
                                    type="text"
                                    placeholder="Rechercher un client..."
                                    value={clientSearch}
                                    onChange={(e) => setClientSearch(e.target.value)}
                                    className={`w-full bg-black/40 border border-gray-700 rounded-xl py-2 pl-10 pr-4 text-white focus:border-${theme.primaryColor}-500 focus:ring-1 focus:ring-${theme.primaryColor}-500/20 outline-none transition-all placeholder-gray-600`}
                                />
                            </div>
                        </div>

                        <GlassCard className="flex-1 overflow-hidden flex flex-col">
                            <div className="overflow-auto custom-scrollbar flex-1">
                                <table className="w-full text-left">
                                    <thead className="sticky top-0 bg-gray-900/95 backdrop-blur-md z-10">
                                        <tr className="text-gray-500 text-xs uppercase tracking-wider border-b border-gray-800">
                                            <th className="p-5">Client</th>
                                            <th className="p-5 text-center">Statut</th>
                                            <th className="p-5 text-right">Profil</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-800/50">
                                        {filteredClients.map((client, idx) => {
                                            let badgeColor = 'gray';
                                            let badgeText = 'Nouveau';
                                            
                                            if (client.totalSpent > 20000) { badgeColor = 'amber'; badgeText = 'VIP'; }
                                            else if (client.visitCount > 3) { badgeColor = 'blue'; badgeText = 'Régulier'; }

                                            return (
                                                <tr key={idx} onClick={() => setSelectedClient(client)} className="hover:bg-white/5 transition-colors cursor-pointer group">
                                                    <td className="p-5">
                                                        <div className="font-bold text-white text-lg group-hover:text-indigo-400 transition-colors">{client.name}</div>
                                                    </td>
                                                    <td className="p-5 text-center">
                                                        <StatusBadge color={badgeColor}>{badgeText}</StatusBadge>
                                                    </td>
                                                    <td className="p-5 text-right">
                                                        <button className="p-2 bg-gray-800 rounded-lg text-gray-400 group-hover:text-white group-hover:bg-indigo-600 transition-all">
                                                            <ChevronRight size={16} />
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {filteredClients.length === 0 && (
                                            <tr>
                                                <td colSpan="3" className="p-8 text-center text-gray-500 italic">Aucun client trouvé.</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </GlassCard>
                    </div>
                );
            };

            const renderHelp = () => (
                <div className="animate-fadeIn max-w-4xl mx-auto space-y-8">
                    <div className="mb-8">
                        <h2 className="text-3xl font-black text-white tracking-tight">Aide & Commandes</h2>
                        <p className="text-gray-400">Guide rapide et commandes utiles.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <GlassCard className="p-6">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Terminal size={20} className={`text-${theme.primaryColor}-400`}/> Commandes Mécaniques</h3>
                            <div className="space-y-4">
                                <div className="bg-black/30 p-3 rounded-lg border border-gray-700/50">
                                    <p className="text-xs text-gray-400 mb-1 uppercase font-bold">Débloquer une pièce en main</p>
                                    <div className="flex justify-between items-center mb-1">
                                        <code className="text-sm text-green-400 font-mono">/body:cancel</code>
                                        <span className="text-xs text-gray-500">Carrosserie</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <code className="text-sm text-green-400 font-mono">/component:cancel</code>
                                        <span className="text-xs text-gray-500">Moteur</span>
                                    </div>
                                </div>
                            </div>
                        </GlassCard>

                        <GlassCard className="p-6">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><Settings size={20} className={`text-${theme.primaryColor}-400`}/> Commandes Workflow</h3>
                            <div className="space-y-2">
                                {['/workflow:clear', '/workflow:close', '/workflow:cursor', '/workflow:open'].map(cmd => (
                                    <div key={cmd} className="flex items-center justify-between bg-black/30 p-2 rounded-lg border border-gray-700/50">
                                        <code className="text-sm text-blue-400 font-mono">{cmd}</code>
                                    </div>
                                ))}
                            </div>
                        </GlassCard>
                    </div>

                    <GlassCard className={`p-6 border-t-4 border-t-${theme.secondaryColor || 'purple'}-500`}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-white flex items-center gap-2"><MessageSquare size={20} className={`text-${theme.secondaryColor || 'purple'}-400`}/> Messages Prédéfinis</h3>
                            {isBoss && (
                                <button onClick={() => {
                                    if(isEditingMessages) saveCustomMessages();
                                    else setIsEditingMessages(true);
                                }} className="text-xs text-gray-400 hover:text-white flex items-center gap-1">
                                    {isEditingMessages ? <><CheckCircle size={14}/> Terminer</> : <><Edit size={14}/> Modifier</>}
                                </button>
                            )}
                        </div>
                        <div className="space-y-4">
                            <div className="bg-gray-800/50 p-4 rounded-xl flex items-start gap-4">
                                <div className="flex-1">
                                    <span className="text-xs font-bold text-emerald-400 uppercase mb-1 block">Ouverture</span>
                                    {isEditingMessages ? (
                                        <textarea 
                                            className="w-full bg-black/40 border border-gray-700 rounded-lg p-2 text-sm text-white" 
                                            value={customMessages.open}
                                            onChange={(e) => setCustomMessages({...customMessages, open: e.target.value})}
                                        />
                                    ) : (
                                        <p className="text-gray-300 italic">"{customMessages.open}"</p>
                                    )}
                                </div>
                                {!isEditingMessages && <button onClick={() => handleCopyText(customMessages.open)} className="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors"><Copy size={16}/></button>}
                            </div>
                            <div className="bg-gray-800/50 p-4 rounded-xl flex items-start gap-4">
                                <div className="flex-1">
                                    <span className="text-xs font-bold text-red-400 uppercase mb-1 block">Fermeture</span>
                                    {isEditingMessages ? (
                                        <textarea 
                                            className="w-full bg-black/40 border border-gray-700 rounded-lg p-2 text-sm text-white" 
                                            value={customMessages.close}
                                            onChange={(e) => setCustomMessages({...customMessages, close: e.target.value})}
                                        />
                                    ) : (
                                        <p className="text-gray-300 italic">"{customMessages.close}"</p>
                                    )}
                                </div>
                                {!isEditingMessages && <button onClick={() => handleCopyText(customMessages.close)} className="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors"><Copy size={16}/></button>}
                            </div>
                        </div>
                    </GlassCard>
                </div>
            );

            const renderHR = () => {
                const canRecruit = isBoss; 
                const canEditFull = isBoss;
                const canEditContractOnly = isLawyer; 

                const missingContracts = employees.filter(e => !e.contractUrl).length;

                return (
                <div className="animate-fadeIn max-w-6xl mx-auto">
                    <div className="mb-8 flex justify-between items-end">
                        <div>
                            <h2 className="text-3xl font-black text-white tracking-tight">Ressources Humaines</h2>
                            <p className="text-gray-400">Gestion des effectifs.</p>
                        </div>
                        {isLawyer && missingContracts > 0 && (
                            <div className="bg-red-500/10 text-red-400 px-4 py-2 rounded-xl border border-red-500/20 font-bold flex items-center gap-2 animate-pulse">
                                <AlertCircle size={20} />
                                {missingContracts} Contrat(s) manquant(s)
                            </div>
                        )}
                    </div>
                    
                    {(isBoss || isLawyer) && applications.length > 0 && (
                        <div className="mb-8">
                             <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <Briefcase size={20} className={`text-${theme.primaryColor}-400`}/> Candidatures en attente ({applications.length})
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {applications.map(app => (
                                    <GlassCard key={app.id} className={`p-4 border border-${theme.primaryColor}-500/30`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <h4 className="font-bold text-white">{app.name}</h4>
                                            <span className="text-xs text-gray-500">{new Date(app.date).toLocaleDateString()}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-xs text-gray-400 mb-2">
                                            <span>Né(e) le: {new Date(app.dob).toLocaleDateString()}</span>
                                            <span>Age HRP: {app.ageHRP} ans</span>
                                        </div>
                                        <div className="flex flex-col gap-1 text-xs text-gray-400 mb-3">
                                            <div className="flex items-center gap-1"><Phone size={12}/> {app.phoneRP}</div>
                                            <div className="flex items-center gap-1"><MessageCircle size={12}/> {app.discord}</div>
                                            <div className="mt-1"><strong>Dispo:</strong> {app.availability}</div>
                                        </div>
                                        <div className="bg-black/20 p-2 rounded text-sm text-gray-300 italic mb-4">"{app.motivation}"</div>
                                        <div className="flex gap-2">
                                            {isBoss && <Button onClick={() => handleAcceptApplication(app)} className="flex-1 text-xs py-2" variant="success">Recruter</Button>}
                                            {isBoss && <Button onClick={() => handleRejectApplication(app.id)} className="flex-1 text-xs py-2" variant="danger">Refuser</Button>}
                                            {isLawyer && !isBoss && <div className="text-xs text-gray-500 italic w-full text-center">En attente de validation patron</div>}
                                        </div>
                                    </GlassCard>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {canRecruit && (
                            <div className="lg:col-span-1">
                                <GlassCard className={`p-6 h-full border-t-4 border-t-${theme.primaryColor}-500`}>
                                    <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                        <UserPlus size={20} className={`text-${theme.primaryColor}-400`}/> Recrutement Manuel
                                    </h3>
                                    <div className="space-y-4">
                                        <Input label="Nom complet" placeholder="Ex: John Doe" value={newEmployee.name} onChange={(e) => setNewEmployee({...newEmployee, name: e.target.value})} />
                                        <Input label="Date de naissance" type="date" value={newEmployee.dob} onChange={(e) => setNewEmployee({...newEmployee, dob: e.target.value})} />
                                        <Select label="Grade / Poste" options={grades.map(g => ({value: g.name, label: g.name}))} value={newEmployee.grade} onChange={(e) => setNewEmployee({...newEmployee, grade: e.target.value})} />
                                        <Input label="Lien Contrat (GDoc)" type="url" placeholder="https://..." value={newEmployee.contractUrl} onChange={(e) => setNewEmployee({...newEmployee, contractUrl: e.target.value})} />
                                        <Input label="IBAN" placeholder="LS89..." value={newEmployee.iban} onChange={(e) => setNewEmployee({...newEmployee, iban: e.target.value})} />
                                        <div className="pt-4">
                                            <Button onClick={handleAddEmployee} className="w-full" variant="primary" color={theme.primaryColor}>Embaucher</Button>
                                        </div>
                                    </div>
                                </GlassCard>
                            </div>
                        )}

                        <div className={canRecruit ? "lg:col-span-2" : "lg:col-span-3"}>
                            <GlassCard className="overflow-hidden h-full flex flex-col">
                                <div className="p-4 border-b border-gray-800 bg-gray-900/50">
                                    <h3 className="font-bold text-white">Effectifs</h3>
                                    {isBoss && dashboardTargetUser && <button onClick={() => setDashboardTargetUser(null)} className={`text-xs text-${theme.primaryColor}-400 hover:text-white`}>Retour liste</button>}
                                </div>
                                <div className="overflow-auto custom-scrollbar flex-1 max-h-[600px]">
                                    <table className="w-full text-left">
                                        <thead className="sticky top-0 bg-gray-900 z-10">
                                            <tr className="text-gray-500 text-xs uppercase tracking-wider">
                                                <th className="p-4 pl-6">Identité</th>
                                                <th className="p-4">Poste</th>
                                                <th className="p-4">Contrat</th>
                                                <th className="p-4 text-center">IBAN</th>
                                                <th className="p-4 text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-800">
                                            {sortedEmployees.map((emp) => (
                                                <tr key={emp.id} className="hover:bg-white/5 transition-colors group">
                                                    <td className="p-4 pl-6">
                                                        <div className="flex items-center gap-3">
                                                            <div className="relative">
                                                                <div className={`w-3 h-3 rounded-full ${emp.isServiceActive ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' : 'bg-red-500/30'}`}></div>
                                                                {emp.isServiceActive && <div className="absolute inset-0 w-3 h-3 rounded-full bg-emerald-500 animate-ping opacity-75"></div>}
                                                            </div>
                                                            <div>
                                                                <div className="font-bold text-white">{emp.name}</div>
                                                                <div className="text-xs text-gray-500 flex items-center gap-1"><Calendar size={10} /> Né(e) le {emp.dob ? new Date(emp.dob).toLocaleDateString() : 'N/A'}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td className="p-4"><StatusBadge color={getGradeColor(emp.grade)}>{emp.grade}</StatusBadge></td>
                                                    <td className="p-4">
                                                        {emp.contractUrl ? (
                                                            <a href={emp.contractUrl} target="_blank" rel="noopener noreferrer" className={`text-${theme.primaryColor}-400 hover:text-${theme.primaryColor}-300 flex items-center gap-1 text-xs font-medium bg-${theme.primaryColor}-500/10 px-2 py-1 rounded w-fit`}><FileText size={12} /> Voir</a>
                                                        ) : (
                                                            <span className="text-red-400 text-xs italic font-bold flex items-center gap-1"><AlertCircle size={10}/> Manquant</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-center"><span className="font-mono text-xs text-gray-400">{emp.iban || '-'}</span></td>
                                                    <td className="p-4 text-center">
                                                        <div className="flex items-center justify-center gap-2">
                                                            {isBoss && <button onClick={() => handleViewEmployeeStats(emp)} className={`p-2 bg-${theme.primaryColor}-500/10 text-${theme.primaryColor}-400 rounded-lg hover:bg-${theme.primaryColor}-500 hover:text-white transition-all`} title="Voir Stats"><Eye size={16} /></button>}
                                                            <button onClick={() => { setEditingEmployee({...emp}); setConfirmFire(false); }} className="p-2 bg-blue-500/10 text-blue-400 rounded-lg hover:bg-blue-500 hover:text-white transition-all" title="Modifier"><Edit size={16} /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </GlassCard>
                        </div>
                    </div>
                    {editingEmployee && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fadeIn">
                            <GlassCard className={`w-full max-w-lg p-6 relative bg-gray-900 border border-${theme.primaryColor}-500/30 shadow-2xl shadow-${theme.primaryColor}-500/20`}>
                                <button onClick={() => setEditingEmployee(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white p-1 hover:bg-white/10 rounded-full transition-colors"><X size={24} /></button>
                                <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><div className={`p-2 bg-${theme.primaryColor}-500 rounded-lg text-white`}><Edit size={20} /></div> Modifier Employé</h3>
                                <div className="space-y-4">
                                    <Input label="Nom complet" value={editingEmployee.name} onChange={(e) => setEditingEmployee({...editingEmployee, name: e.target.value})} readOnly={!canEditFull} />
                                    <Input label="Date de naissance" type="date" value={editingEmployee.dob} onChange={(e) => setEditingEmployee({...editingEmployee, dob: e.target.value})} readOnly={!canEditFull}/>
                                    <Select label="Grade / Poste" options={grades.map(g => ({value: g.name, label: g.name}))} value={editingEmployee.grade} onChange={(e) => setEditingEmployee({...editingEmployee, grade: e.target.value})} readOnly={!canEditFull} />
                                    
                                    <div className={`p-2 bg-${theme.primaryColor}-500/10 border border-${theme.primaryColor}-500/30 rounded-xl space-y-2`}>
                                        <Input label="Lien Contrat (GDoc)" type="url" value={editingEmployee.contractUrl} onChange={(e) => setEditingEmployee({...editingEmployee, contractUrl: e.target.value})} prefix={<FileSignature size={14}/>}/>
                                        <Input label="IBAN" value={editingEmployee.iban} onChange={(e) => setEditingEmployee({...editingEmployee, iban: e.target.value})} prefix={<CreditCard size={14}/>}/>
                                    </div>
                                    
                                    {canEditFull && (
                                        <div className={`pt-4 mt-2 border-t border-gray-700/50 bg-${theme.primaryColor}-500/5 p-4 rounded-xl`}>
                                            <h4 className={`text-sm font-bold text-${theme.primaryColor}-300 uppercase mb-3 flex items-center gap-2`}><Key size={14}/> Accès Sécurisé</h4>
                                            <Input label="Nouveau Mot de passe" type="text" prefix={<Lock size={14}/>} value={editingEmployee.password} onChange={(e) => setEditingEmployee({...editingEmployee, password: e.target.value})} placeholder="Définir un mot de passe..." />
                                        </div>
                                    )}

                                    <div className="pt-4 flex gap-3">
                                        <Button variant="secondary" onClick={() => setEditingEmployee(null)} className="flex-1">Annuler</Button>
                                        <Button onClick={handleSaveEdit} className="flex-1 shadow-indigo-500/25" color={theme.primaryColor}>Enregistrer</Button>
                                    </div>
                                    
                                    {canEditFull && editingEmployee.id !== currentUser.id && (
                                        <div className="mt-6 pt-4 border-t border-red-500/20">
                                             <h4 className="text-sm font-bold text-red-400 uppercase mb-2 flex items-center gap-2"><AlertCircle size={14}/> Zone de Danger</h4>
                                             {!confirmFire ? (
                                                 <Button variant="danger" onClick={() => setConfirmFire(true)} className="w-full justify-center"><UserMinus size={16} /> Licencier cet employé</Button>
                                             ) : (
                                                 <div className="flex gap-2 animate-fadeIn">
                                                      <Button variant="secondary" onClick={() => setConfirmFire(false)} className="flex-1">Annuler</Button>
                                                      <Button variant="danger" onClick={() => { handleFireEmployee(editingEmployee.id); setEditingEmployee(null); }} className="flex-1 justify-center bg-red-600 hover:bg-red-700 border-red-500">Confirmer !</Button>
                                                 </div>
                                             )}
                                             {confirmFire && <p className="text-center text-xs text-red-400 mt-2">Cette action est irréversible.</p>}
                                        </div>
                                    )}
                                </div>
                            </GlassCard>
                        </div>
                    )}
                </div>
            );
            };
            
            const renderContracts = () => {
                const canEdit = isBoss || isLawyer;

                return (
                <div className="animate-fadeIn max-w-6xl mx-auto">
                    <div className="mb-8 flex justify-between items-end">
                        <div>
                            <h2 className="text-3xl font-black text-white tracking-tight">Contrats Entreprises</h2>
                            <p className="text-gray-400">Gestion des partenariats et accès aux documents.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Form Column (Restricted) */}
                        {canEdit && (
                            <div className="lg:col-span-1">
                                <GlassCard className={`p-6 border-t-4 border-t-${theme.primaryColor}-500 h-full flex flex-col`}>
                                    <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                                        <FileSignature size={20} className={`text-${theme.primaryColor}-400`}/> {editingContractId ? 'Modifier Contrat' : 'Nouveau Contrat'}
                                    </h3>
                                    <div className="space-y-4 flex-1">
                                        <Input label="Nom de l'entreprise" placeholder="Ex: LSPD" value={newContract.company} onChange={(e) => setNewContract({...newContract, company: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <Input label="Date début" type="date" value={newContract.date} onChange={(e) => setNewContract({...newContract, date: e.target.value})} />
                                            <Input label="Date fin (Optionnel)" type="date" value={newContract.endDate} onChange={(e) => setNewContract({...newContract, endDate: e.target.value})} />
                                        </div>
                                        <Input label="Lien Google Doc (Principal)" type="url" placeholder="https://..." value={newContract.url} onChange={(e) => setNewContract({...newContract, url: e.target.value})} />
                                        
                                        <div className="flex flex-col gap-2 w-full">
                                            <label className={`text-xs font-bold text-${theme.primaryColor}-300 uppercase tracking-wider ml-1`}>Conditions</label>
                                            <textarea 
                                                className={`w-full bg-black/40 border border-gray-700 rounded-xl py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-${theme.primaryColor}-500 focus:ring-2 focus:ring-${theme.primaryColor}-500/20 transition-all text-lg min-h-[120px] resize-none`}
                                                placeholder="Ex: Maintenance véhicules, tarifs préférentiels..."
                                                value={newContract.description}
                                                onChange={(e) => setNewContract({...newContract, description: e.target.value})}
                                            ></textarea>
                                        </div>
                                        
                                        <div className="pt-2 border-t border-gray-700/50 mt-2">
                                            <label className={`text-xs font-bold text-${theme.primaryColor}-300 uppercase tracking-wider mb-2 block`}>Documents Annexes</label>
                                            <div className="flex gap-2 mb-2">
                                                <input className="w-1/2 bg-black/40 border border-gray-700 rounded-lg px-2 py-1 text-sm text-white" placeholder="Nom (ex: Tarifs)" value={tempDoc.name} onChange={(e) => setTempDoc({...tempDoc, name: e.target.value})}/>
                                                <input className="w-1/2 bg-black/40 border border-gray-700 rounded-lg px-2 py-1 text-sm text-white" placeholder="URL" value={tempDoc.url} onChange={(e) => setTempDoc({...tempDoc, url: e.target.value})}/>
                                                <button onClick={handleAddTempDoc} className={`bg-${theme.primaryColor}-500 hover:bg-${theme.primaryColor}-600 text-white rounded-lg p-1 transition-colors`}><Plus size={16}/></button>
                                            </div>
                                            {newContract.supplementaryDocs.length > 0 && (
                                                <ul className="space-y-1 mb-4">
                                                    {newContract.supplementaryDocs.map((doc, idx) => (
                                                        <li key={idx} className="flex items-center gap-2 text-xs text-gray-300 bg-white/5 px-2 py-1 rounded"><Paperclip size={10} /> {doc.name}</li>
                                                    ))}
                                                </ul>
                                            )}
                                        </div>
                                    </div>
                                    <div className="pt-4 mt-auto flex gap-2">
                                        {editingContractId && <Button variant="secondary" onClick={handleCancelContractEdit} className="flex-1">Annuler</Button>}
                                        <Button onClick={handleSaveContract} className="flex-1" color={theme.primaryColor}>{editingContractId ? 'Sauvegarder' : 'Ajouter'}</Button>
                                    </div>
                                </GlassCard>
                            </div>
                        )}

                        <div className={`${canEdit ? 'lg:col-span-2' : 'lg:col-span-3'} grid grid-cols-1 md:grid-cols-2 gap-4`}>
                            {contracts.map(contract => {
                                const isExpired = contract.endDate && new Date(contract.endDate) < new Date();
                                return (
                                <GlassCard key={contract.id} className={`p-6 relative group border border-transparent transition-all ${isExpired ? 'border-red-500/30 bg-red-500/5' : `hover:border-${theme.primaryColor}-500/50`}`}>
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-4">
                                            <div className={`p-3 rounded-xl ${isExpired ? 'bg-red-500/20 text-red-400' : `bg-${theme.primaryColor}-500/10 text-${theme.primaryColor}-400`}`}>
                                                <Building size={28} />
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-white text-xl flex items-center gap-2">
                                                    {contract.company}
                                                    {isExpired ? <span className="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full uppercase font-bold tracking-wide">Expiré</span> : <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full uppercase font-bold tracking-wide">Actif</span>}
                                                </h3>
                                                <div className="flex items-center gap-3 text-xs text-gray-500 mt-1">
                                                    <span className="flex items-center gap-1"><Clock size={12}/> Début: {new Date(contract.date).toLocaleDateString()}</span>
                                                    {contract.endDate && <span className={`flex items-center gap-1 ${isExpired ? 'text-red-400 font-bold' : ''}`}><Clock size={12}/> Fin: {new Date(contract.endDate).toLocaleDateString()}</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            {canEdit && <button onClick={() => handleEditContractClick(contract)} className="p-2 bg-gray-800 hover:bg-blue-500/20 text-gray-500 hover:text-blue-500 rounded-lg transition-all" title="Modifier"><Edit size={18}/></button>}
                                            {isBoss && <button onClick={() => handleDeleteContract(contract.id)} className={`p-2 rounded-lg transition-all ${deleteConfirmId === contract.id ? 'bg-red-500 text-white' : 'bg-gray-800 hover:bg-red-500/20 text-gray-500 hover:text-red-500'}`} title={deleteConfirmId === contract.id ? "Confirmer la suppression" : "Supprimer"}>{deleteConfirmId === contract.id ? <CheckCircle size={18}/> : <Trash2 size={18}/>}</button>}
                                        </div>
                                    </div>
                                    <p className={`text-gray-300 text-base mb-6 pl-1 border-l-2 border-${theme.primaryColor}-500/30 ml-2 whitespace-pre-wrap`}>{contract.description}</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <a href={contract.url} target="_blank" rel="noopener noreferrer" className={`flex items-center justify-center gap-2 px-4 py-3 rounded-xl font-bold transition-all ${contract.url ? `bg-gradient-to-r from-${theme.primaryColor}-600 to-${theme.primaryColor}-500 hover:from-${theme.primaryColor}-500 hover:to-${theme.primaryColor}-400 text-white shadow-lg shadow-${theme.primaryColor}-500/20` : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}><FileText size={18} /> Contrat Principal</a>
                                        {contract.supplementaryDocs && contract.supplementaryDocs.length > 0 && (
                                            <div className="flex flex-col gap-2">
                                                {contract.supplementaryDocs.map((doc, i) => (
                                                    <a key={i} href={doc.url} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between px-4 py-2 bg-gray-800/50 hover:bg-gray-800 border border-gray-700 rounded-lg text-sm text-gray-300 hover:text-white transition-colors">
                                                        <span className="flex items-center gap-2"><Paperclip size={14} className={`text-${theme.primaryColor}-400`}/> {doc.name}</span><ExternalLink size={12} className="opacity-50"/>
                                                    </a>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </GlassCard>
                            )})}
                        </div>
                    </div>
                </div>
                );
            };

             const renderSalaries = () => (
                 <div className="animate-fadeIn">
                    <WeekNavigator selectedDate={selectedDate} onPrev={handlePrevWeek} onNext={handleNextWeek} themeColor={theme.primaryColor} />
                    <div className="mb-8">
                        <h2 className="text-3xl font-black text-white tracking-tight">Salaires & Primes</h2>
                        <p className="text-gray-400">Suivi basé sur la rentabilité nette (Objectif = 1.5x Salaire).</p>
                    </div>
                    {/* MODIFICATION ICI : Ajout du wrapper overflow-x-auto et min-width sur la table */}
                    <GlassCard className="overflow-hidden flex flex-col">
                        <div className={`p-1 bg-gradient-to-r from-${theme.secondaryColor || 'violet'}-500 via-${theme.primaryColor}-500 to-blue-500 opacity-20`}></div>
                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left min-w-[900px]">
                                <thead>
                                    <tr className="bg-gray-900/50 border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
                                        <th className="p-5">Employé</th>
                                        <th className="p-5 text-center">Heures</th>
                                        <th className="p-5 w-1/3">Rentabilité (Net)</th>
                                        <th className="p-5 text-right">Salaire (Proportionnel)</th>
                                        <th className="p-5 text-right">Prime (Conditionnelle)</th>
                                        <th className="p-5 text-right">Total à Payer</th>
                                        <th className="p-5 text-center">Fiche</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-800/50">
                                    {weeklyStats.employeeStats.filter(e => e.grade !== 'Avocat').map(emp => { 
                                        const gradeInfo = grades.find(g => g.name === emp.grade);
                                        const maxSalary = gradeInfo ? gradeInfo.maxSalary : 0;
                                        
                                        // NOUVELLE LOGIQUE
                                        const targetProfit = maxSalary * 1.5;
                                        const progress = targetProfit > 0 ? Math.min((emp.profit / targetProfit) * 100, 100) : 100;
                                        const isComplete = progress >= 100;
                                        const earnedSalary = maxSalary * (progress / 100);
                                        
                                        const bonusAmount = emp.bonusTheorique;
                                        const finalBonus = isComplete ? bonusAmount : 0; 
                                        return (
                                            <tr key={emp.id} className="group hover:bg-white/5 transition-colors">
                                                <td className="p-5">
                                                    <div className="font-bold text-white text-lg">{emp.name}</div>
                                                    <div className={`text-xs text-${theme.primaryColor}-400 font-medium uppercase tracking-wide`}>{emp.grade}</div>
                                                </td>
                                                <td className="p-5 text-center">
                                                    <div className="flex items-center justify-center gap-2 text-white font-mono bg-gray-800/50 px-3 py-1.5 rounded-lg border border-gray-700">
                                                        <Clock size={14} className={`text-${theme.primaryColor}-400`} />
                                                        {formatDuration(emp.totalDurationMs)}
                                                    </div>
